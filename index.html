/* ---------- prikaz tjedna: sedam stupaca na istoj mrezi sati ---------- */
function renderWeekGrid(host, keepScroll) {
  const days = weekDays(selDay);
  const per = days.map(dayItems);
  const today = ymd(new Date());

  let lo = 24 * 60, hi = 0, any = false;
  per.forEach((items, i) => {
    const a = +parseYmd(days[i]);
    items.forEach(it => {
      any = true;
      lo = Math.min(lo, (it.cs - a) / 60000);
      hi = Math.max(hi, (it.ce - a) / 60000);
    });
  });

  if (!any) {
    ttDay = null;
    if (tlFull) setTimelineFull(false);
    host.innerHTML = '<div class="empty"><div class="e">\u{1F5D3}️</div><p>' + esc(t('emptyDay')) + '</p></div>';
    return;
  }

  let h0 = Math.floor(lo / 60), h1 = Math.ceil(hi / 60);
  if (days.indexOf(today) >= 0) { const nh = new Date().getHours(); h0 = Math.min(h0, nh); h1 = Math.max(h1, nh + 1); }
  h0 = Math.max(0, h0); h1 = Math.min(24, Math.max(h1, h0 + 3));
  const span = h1 - h0;
  ttSpan = span;
  const H = x => 'calc(var(--pph) * ' + x.toFixed(4) + ')';

  let lines = '';
  for (let h = h0; h <= h1; h++) {
    lines += '<div class="tt-hour" data-i="' + (h - h0) + '" style="top:' + H(h - h0) + '"><b>' +
      String(h % 24).padStart(2, '0') + ':00</b></div>';
  }

  const cols = days.map((ds, i) => {
    const a = +parseYmd(ds);
    const gaps = gapMarkup(gapsFor(per[i], a, h0 * 60, h1 * 60), h0, H);
    const evs = per[i].map((it, idx) => {
      const m0 = (it.cs - a) / 60000, m1 = (it.ce - a) / 60000;
      const c = catOf(it.log.catId), fg = contrast(c.color);
      return '<div class="tt-ev wk" data-id="' + it.log.id + '" style="' +
        'top:' + H((m0 - h0 * 60) / 60) + ';' +
        'height:max(4px, calc(var(--pph) * ' + ((m1 - m0) / 60).toFixed(4) + ' - 2px));' +
        'left:0;right:0;background:' + c.color + ';color:' + fg +
        ';animation-delay:' + Math.min(idx * 14, 200) + 'ms">' +
        '<div class="tt-t">' + catMark(c, 12, 'currentColor') + '</div></div>';
    }).join('');
    return '<div class="wk-col' + (ds === today ? ' today' : '') + '" data-d="' + ds + '">' + gaps + evs + '</div>';
  }).join('');

  let nowLine = '';
  if (days.indexOf(today) >= 0) {
    const nm = new Date().getHours() * 60 + new Date().getMinutes();
    if (nm >= h0 * 60 && nm <= h1 * 60) {
      nowLine = '<div class="tt-now" style="top:' + H((nm - h0 * 60) / 60) + '"><b>' + fmtT(new Date()) + '</b></div>';
    }
  }

  const head = '<div class="wk-head">' + days.map(ds => {
    const d = parseYmd(ds);
    return '<button class="wk-d' + (ds === today ? ' today' : '') + '" data-d="' + ds + '">' +
      '<span class="a">' + esc(d.toLocaleDateString(loc(), { weekday: 'short' }).replace('.', '')) + '</span>' +
      '<span class="b">' + d.getDate() + '</span></button>';
  }).join('') + '</div>';

  host.innerHTML =
    '<div class="tt wk-mode" id="tt-box">' + head +
      '<div class="tt-grid' + (keepScroll === null ? ' anim' : '') + '" id="tt-grid" style="height:' + H(span) + '">' +
      lines + '<div class="wk-cols">' + cols + '</div>' + nowLine + '</div></div>' +
    zoomerMarkup();

  const box = $('tt-box');
  fitTimetable();
  applyZoom();
  if (keepScroll !== null) box.scrollTop = keepScroll;
  else {
    const focus = days.indexOf(today) >= 0
      ? Math.min(new Date().getHours() * 60 + new Date().getMinutes(), hi) : lo;
    box.scrollTop = Math.max(0, (focus - h0 * 60) / 60 * pxPerHour() - box.clientHeight * 0.5);
  }
  ttDay = 'W' + days[0];

  bindZoomer();
  host.querySelectorAll('.tt-ev').forEach(e => e.onclick = () => openEvent('manual', e.dataset.id));
  bindGaps(host, e => e.closest('.wk-col').dataset.d);
  host.querySelectorAll('.wk-d').forEach(b => b.onclick = () => {
    selDay = b.dataset.d; tlScale = 'day'; LS.set('kr_scale', tlScale);
    ttDay = null; renderDayStrip(); renderTlNav(); renderTimeline();
  });
}

/* ============================================================
   TIMETABLE
   ============================================================ */
function dayItems(dStr) {
  const a = +parseYmd(dStr), b = a + DAY_MS;
  const out = [];
  logs.forEach(l => {
    const s = +new Date(l.startTime), e = +effEnd(l);
    if (e <= a || s >= b) return;
    out.push({ log: l, s, e, cs: Math.max(s, a), ce: Math.min(e, b) });
  });
  out.sort((x, y) => x.cs - y.cs);
  return out;
}
/* Prazni rasponi unutar prikazanog dijela dana. */
function gapsFor(items, dayStartMs, loMin, hiMin) {
  const spans = items.map(it => [(it.cs - dayStartMs) / 60000, (it.ce - dayStartMs) / 60000])
                     .sort((a, b) => a[0] - b[0]);
  const merged = [];
  spans.forEach(sp => {
    const last = merged[merged.length - 1];
    if (last && sp[0] <= last[1]) last[1] = Math.max(last[1], sp[1]);
    else merged.push([sp[0], sp[1]]);
  });
  const gaps = [];
  let cur = loMin;
  merged.forEach(m => {
    if (m[0] - cur >= 5) gaps.push([cur, m[0]]);
    cur = Math.max(cur, m[1]);
  });
  if (hiMin - cur >= 5) gaps.push([cur, hiMin]);
  return gaps;
}

function gapMarkup(gaps, h0, H) {
  return gaps.map(g =>
    '<div class="tt-gap" data-a="' + g[0] + '" data-b="' + g[1] + '" style="' +
    'top:' + H((g[0] - h0 * 60) / 60) + ';' +
    'height:max(4px, calc(var(--pph) * ' + ((g[1] - g[0]) / 60).toFixed(4) + ' - 2px))">' +
    '<span>+</span></div>').join('');
}

function bindGaps(host, dayOf) {
  host.querySelectorAll('.tt-gap').forEach(e => {
    e.onclick = () => {
      const a = +parseYmd(dayOf(e));
      openEvent('manual', null, {
        s: new Date(a + Number(e.dataset.a) * 60000),
        e: new Date(a + Number(e.dataset.b) * 60000)
      });
    };
  });
}

function assignLanes(items) {
  let lanes = [], cluster = [], cEnd = -1;
  const flush = () => {
    if (!cluster.length) return;
    const n = Math.max.apply(null, cluster.map(i => i.lane)) + 1;
    cluster.forEach(i => i.lanes = n);
    cluster = []; lanes = [];
  };
  items.forEach(it => {
    if (cluster.length && it.cs >= cEnd) { flush(); cEnd = -1; }
    let li = lanes.findIndex(end => end <= it.cs);
    if (li < 0) { lanes.push(it.ce); li = lanes.length - 1; } else lanes[li] = it.ce;
    it.lane = li;
    cluster.push(it);
    cEnd = Math.max(cEnd, it.ce);
  });
  flush();
}

function renderTimeline() {
  const host = $('view-tl');
  const prevBox0 = host.querySelector('.tt');
  if (tlScale === 'week') {
    const key = 'W' + weekDays(selDay)[0];
    return renderWeekGrid(host, (prevBox0 && ttDay === key) ? prevBox0.scrollTop : null);
  }
  const items = dayItems(selDay);
  const isToday = selDay === ymd(new Date());
  const prevBox = host.querySelector('.tt');
  const keepScroll = (prevBox && ttDay === selDay) ? prevBox.scrollTop : null;

  if (!items.length) {
    ttDay = null;
    host.innerHTML = '<div class="empty"><div class="e">🗓️</div><p>' + esc(t('emptyDay')) + '</p>' +
      '<button class="now-cta" id="tl-cta" style="margin-top:14px;height:40px">' + esc(t('add')) + '</button></div>';
    $('tl-cta').onclick = () => openEvent('start');
    return;
  }

  const a = +parseYmd(selDay);
  const mins = it => [(it.cs - a) / 60000, (it.ce - a) / 60000];
  let lo = 24 * 60, hi = 0;
  items.forEach(it => { const [m0, m1] = mins(it); lo = Math.min(lo, m0); hi = Math.max(hi, m1); });
  let h0 = Math.floor(lo / 60), h1 = Math.ceil(hi / 60);
  if (isToday) { const nh = new Date().getHours(); h0 = Math.min(h0, nh); h1 = Math.max(h1, nh + 1); }
  h0 = Math.max(0, h0); h1 = Math.min(24, Math.max(h1, h0 + 3));
  const span = h1 - h0;
  ttSpan = span;

  assignLanes(items);

  /* Sva geometrija ide preko --pph (piksela po satu), pa fader mijenja
     samo tu jednu varijablu - bez ponovnog crtanja DOM-a. */
  const H = x => 'calc(var(--pph) * ' + x.toFixed(4) + ')';
  let g = '';
  for (let h = h0; h <= h1; h++) {
    g += '<div class="tt-hour" data-i="' + (h - h0) + '" style="top:' + H(h - h0) + '"><b>' + String(h % 24).padStart(2, '0') + ':00</b></div>';
  }
  g += gapMarkup(gapsFor(items, a, h0 * 60, h1 * 60), h0, H);
  items.forEach((it, idx) => {
    const [m0, m1] = mins(it);
    const c = catOf(it.log.catId), fg = contrast(c.color);
    const open = !it.log.endTime && it.log === ongoingLog();
    const n = it.lanes || 1, w = 100 / n;
    const label = logLabel(it.log);
    const meta = fmtT(new Date(it.s)) + (open ? ' · ' + t('ongoing') : '–' + fmtT(new Date(it.e))) + ' · ' + fmtDur(m1 - m0);
    g += '<div class="tt-ev' + (open ? ' open' : '') + '" data-id="' + it.log.id + '" style="' +
      'top:' + H((m0 - h0 * 60) / 60) + ';' +
      'height:max(4px, calc(var(--pph) * ' + ((m1 - m0) / 60).toFixed(4) + ' - 2px));' +
      'left:' + (it.lane * w) + '%;width:calc(' + w + '% - 4px);' +
      'background:' + c.color + ';color:' + fg + ';animation-delay:' + Math.min(idx * 22, 260) + 'ms">' +
      '<div class="tt-t">' + catMark(c, 13, 'currentColor') + '<em>' + esc(label) + '</em></div>' +
      '<div class="tt-m">' + esc(meta) + '</div>' +
      '</div>';
  });
  if (isToday) {
    const nm = new Date().getHours() * 60 + new Date().getMinutes();
    if (nm >= h0 * 60 && nm <= h1 * 60) {
      g += '<div class="tt-now" style="top:' + H((nm - h0 * 60) / 60) + '"><b>' + fmtT(new Date()) + '</b></div>';
    }
  }

  host.innerHTML =
    '<div class="tt" id="tt-box"><div class="tt-grid' + (keepScroll === null ? ' anim' : '') + '" id="tt-grid" style="height:' + H(span) + '">' + g + '</div></div>' +
    zoomerMarkup();

  const box = $('tt-box');
  fitTimetable();
  applyZoom();
  if (keepScroll !== null) {
    box.scrollTop = keepScroll;
  } else {
    /* Ako je sada vec proslo zadnji unos, nema smisla gledati praznu buducnost. */
    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    const focus = isToday ? Math.min(nowMin, hi) : lo;
    box.scrollTop = Math.max(0, (focus - h0 * 60) / 60 * pxPerHour() - box.clientHeight * 0.5);
  }
  ttDay = selDay;

  bindZoomer();
  host.querySelectorAll('.tt-ev').forEach(e => e.onclick = () => openEvent('manual', e.dataset.id));
  bindGaps(host, () => selDay);
}

/* Namjesti zum tako da prikazani raspon sati tocno ispuni kalendar. */
function fitZoomToView() {
  const box = $('tt-box');
  if (!box || !ttSpan) return;
  const head = box.querySelector('.wk-head');
  const pad = 32 + (head ? head.getBoundingClientRect().height : 0);
  const avail = box.clientHeight - pad;
  if (avail <= 0) return;
  const pph = avail / ttSpan;
  const z = Math.log(pph / PPH_MIN) / Math.log(PPH_MAX / PPH_MIN);
  zoom = Math.max(0, Math.min(1, z));
  const zi = $('tt-zoom'); if (zi) zi.value = zoom;
  applyZoom();
}

/* Fader, tiha tipka za prosirenje, a u punom zaslonu i jasna tipka za povratak. */
function zoomerMarkup() {
  return '<div class="zoomer"><i class="zi s"></i>' +
    '<input type="range" id="tt-zoom" min="0" max="1" step="0.001" value="' + zoom + '" aria-label="Zoom">' +
    '<i class="zi l"></i>' +
    (tlFull ? '' : '<button class="tt-exp" id="tt-exp" aria-label="' + esc(t('expand')) + '">' + ICO_EXPAND + '</button>') +
    '</div>' +
    (tlFull ? '<button class="tt-collapse" id="tt-col">' + ICO_COLLAPSE +
              '<span>' + esc(t('collapse')) + '</span></button>' : '');
}

function bindZoomer() {
  const z = $('tt-zoom');
  if (z) z.oninput = e => setZoom(parseFloat(e.target.value));
  const e1 = $('tt-exp'); if (e1) e1.onclick = () => setTimelineFull(true);
  const e2 = $('tt-col'); if (e2) e2.onclick = () => setTimelineFull(false);
}

/* Kalendar raste prema gore: pamtimo stari pravokutnik, pustimo novi
   raspored, pa animiramo od staroga do novoga. */
function setTimelineFull(on) {
  const box = $('tt-box');
  if (!box || on === tlFull) return;
  const r0 = box.getBoundingClientRect();

  if (on) zoomSaved = zoom;
  tlFull = on;
  document.body.classList.toggle('tl-full', on);
  if (on) window.scrollTo(0, 0);

  const host = $('view-tl');
  const foot = host.querySelector('.zoomer');
  if (foot) {
    const old = host.querySelector('.tt-collapse');
    if (old) old.remove();
    foot.outerHTML = zoomerMarkup();
    bindZoomer();
  }
  fitTimetable();

  const r1 = box.getBoundingClientRect();
  box.style.transition = 'none';
  box.style.maxHeight = 'none';
  box.style.height = r0.height + 'px';
  box.style.transform = 'translateY(' + (r0.top - r1.top) + 'px)';
  void box.offsetWidth;
  box.style.transition = 'height .42s cubic-bezier(.22,1,.36,1), transform .42s cubic-bezier(.22,1,.36,1)';
  box.style.height = r1.height + 'px';
  box.style.transform = 'translateY(0)';

  let settled = false;
  const done = () => {
    if (settled) return;
    settled = true;
    box.removeEventListener('transitionend', done);
    box.style.transition = ''; box.style.transform = ''; box.style.height = '';
    fitTimetable();
    if (tlFull) {
      fitZoomToView();                              // dan ispuni ekran
    } else if (zoomSaved !== null) {
      zoom = zoomSaved; zoomSaved = null;           // vrati zum kakav je bio
      const zi = $('tt-zoom'); if (zi) zi.value = zoom;
    }
    applyZoom();
  };
  box.addEventListener('transitionend', done);
  setTimeout(done, 520);
}

/* Kalendar zauzme sav preostali prostor, ali tako da fader ispod njega ostane vidljiv. */
function fitTimetable() {
  const box = $('tt-box'); if (!box) return;
  if (tlFull) { box.style.maxHeight = ''; return; }   /* visinu odreduje raspored */
  const docTop = box.getBoundingClientRect().top + window.scrollY;
  const avail = window.innerHeight - docTop - 78;
  box.style.maxHeight = Math.max(220, Math.min(avail, 640)) + 'px';
}

/* Zumiranje zadrzava sredinu vidljivog dijela na istom vremenu. */
function setZoom(v) {
  zoomSaved = null;                     // rucna promjena ponistava automatski povratak
  const box = $('tt-box');
  const anchor = box ? (box.scrollTop + box.clientHeight / 2) / pxPerHour() : null;
  zoom = Math.min(1, Math.max(0, v));
  LS.set('kr_zoom', String(zoom));
  applyZoom();
  if (box && anchor !== null) box.scrollTop = Math.max(0, anchor * pxPerHour() - box.clientHeight / 2);
}
function applyZoom() {
  const g = $('tt-grid'); if (!g) return;
  const pph = pxPerHour();
  g.style.setProperty('--pph', pph.toFixed(2) + 'px');
  /* Blok pokazuje onoliko koliko mu visina dopusti - nikad ne laze o trajanju. */
  g.querySelectorAll('.tt-ev').forEach(e => {
    const h = e.offsetHeight;
    e.classList.toggle('tiny', h < 38);
    e.classList.toggle('micro', h < 17);
  });
  /* Pri odzumiranju prorijedi oznake sati da se ne slijepe. */
  g.querySelectorAll('.tt-gap').forEach(e => e.classList.toggle('micro', e.offsetHeight < 26));
  const step = pph < 30 ? 3 : (pph < 46 ? 2 : 1);
  g.querySelectorAll('.tt-hour').forEach(e => e.classList.toggle('nolabel', (+e.dataset.i % step) !== 0));
}

/* ============================================================
   ANALITIKA
   ============================================================ */
function totalsFor(from, to) {
  const map = {}; let total = 0, n = 0;
  logs.forEach(l => {
    const s = +new Date(l.startTime), e = +effEnd(l);
    const cs = Math.max(s, from), ce = Math.min(e, to);
    if (ce <= cs) return;
    const m = (ce - cs) / 60000;
    map[l.catId] = (map[l.catId] || 0) + m; total += m; n++;
  });
  return { map, total, n };
}

function renderAnalytics() {
  const host = $('view-an');
  const a = +parseYmd(selDay);
  const from = anRange === 'day' ? a : a - 6 * DAY_MS;
  const to = a + DAY_MS;
  const { map, total, n } = totalsFor(from, to);
  const rows = Object.entries(map).map(([id, m]) => ({ c: catOf(id), m })).sort((x, y) => y.m - x.m);

  let html = '<div class="seg sm" id="an-seg" style="margin-bottom:14px">' +
    '<button data-r="day" class="' + (anRange === 'day' ? 'on' : '') + '">' + esc(t('anDay')) + '</button>' +
    '<button data-r="week" class="' + (anRange === 'week' ? 'on' : '') + '">' + esc(t('anWeek')) + '</button></div>';

  if (!rows.length) {
    html += '<div class="empty"><div class="e">📊</div><p>' + esc(t('noData')) + '</p></div>';
    host.innerHTML = html; bindAnSeg(); return;
  }

  html += '<div class="stat-row">' +
    '<div class="stat"><b>' + esc(fmtDur(total)) + '</b><small>' + esc(t('tracked')) + '</small></div>' +
    '<div class="stat"><b>' + n + '</b><small>' + esc(t('entries')) + '</small></div>' +
    '<div class="stat"><b class="stat-mk">' + catMark(rows[0].c, 19) + '</b><small>' + esc(t('top')) + '</small></div>' +
    '</div>';

  let acc = 0; const stops = [];
  rows.forEach(r => { const p = r.m / total * 100; stops.push(r.c.color + ' ' + acc.toFixed(2) + '% ' + (acc + p).toFixed(2) + '%'); acc += p; });

  html += '<div class="an-card"><div class="donut-wrap">' +
    '<div class="donut" style="background:conic-gradient(' + stops.join(',') + ')">' +
    '<div class="donut-c"><b>' + durParts(total).map(esc).join('<br>') + '</b><small>' + esc(anRange === 'day' ? t('anDay') : t('anWeek')) + '</small></div></div>' +
    '<div class="an-legend">' +
    rows.slice(0, 5).map(r => '<div class="an-li"><i class="sw" style="background:' + r.c.color + '"></i>' +
      '<span class="nm">' + esc(r.c.name) + '</span><span class="vl">' + Math.round(r.m / total * 100) + '%</span></div>').join('') +
    (rows.length > 5 ? '<div class="an-li" style="color:var(--text-3)"><span class="nm">+' + (rows.length - 5) + '</span></div>' : '') +
    '</div></div></div>';

  html += '<div class="an-card"><div class="bars">' + rows.map(r =>
    '<div class="bar-row"><div class="bar-top"><span class="be">' + catMark(r.c, 15) + '</span>' +
    '<span class="bn">' + esc(r.c.name) + '</span>' +
    '<span class="bv">' + esc(fmtDur(r.m)) + '</span>' +
    '<span class="bp">' + Math.round(r.m / total * 100) + '%</span></div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + (r.m / rows[0].m * 100) + '%;background:' + r.c.color + '"></div></div></div>'
  ).join('') + '</div></div>';

  host.innerHTML = html;
  bindAnSeg();
}
function bindAnSeg() {
  const s = $('an-seg'); if (!s) return;
  s.querySelectorAll('button').forEach(b => b.onclick = () => { anRange = b.dataset.r; renderAnalytics(); });
}

/* ============================================================
   BRZE AKCIJE

function closeOngoing(at) {
  const og = ongoingLog();
  if (og && at > +new Date(og.startTime)) og.endTime = new Date(at).toISOString();
}
function startQuick(q) {
  snap();
  const now = Date.now();
  closeOngoing(now);
  logs.push({ id: uid(), title: q.name, catId: q.catId, startTime: new Date(now).toISOString(), endTime: '', note: '' });
  sortLogs(); save();
  selDay = ymd(new Date());
  renderAll();
  toast(t('started') + ' · ' + q.name, true);
}
function finishNow() {
  const og = ongoingLog(); if (!og) return;
  snap();
  og.endTime = new Date().toISOString();
  save(); renderAll();
  toast(t('saved') + ' · ' + fmtDur((Date.now() - +new Date(og.startTime)) / 60000), true);
}

   SHEETS
   ============================================================ */
function openSheet(id) {
  $('scrim-' + id).classList.add('on');
  $('sheet-' + id).classList.add('on');
  document.body.style.overflow = 'hidden';
  document.body.classList.add('sheet-open');
}
function closeSheet(id) {
  $('scrim-' + id).classList.remove('on');
  $('sheet-' + id).classList.remove('on');
  if (!document.querySelector('.sheet.on')) {
    document.body.style.overflow = '';
    document.body.classList.remove('sheet-open');
  }
  if (id === 'manage') afterManageClose();
}

/* nakon zatvaranja uredivaca: makni prazne kategorije i po potrebi vrati unos */
function afterManageClose() {
  pruneCats();
  openPicker = null;
  renderAll();
  if (backToEvent) {
    backToEvent = false;
    if (liveCats().length) {
      if (evCat && !liveCats().some(c => c.id === evCat)) evCat = null;
      renderEvent();
      setTimeout(() => openSheet('event'), 120);
    }
  }
}

/* ---------- pilule kategorija ---------- */
function catPills(host, selectedId, onPick, withGhost, withNone) {
  host.innerHTML = '';
  liveCats().forEach(c => {
    const b = document.createElement('button');
    const on = c.id === selectedId;
    b.className = 'cpill' + (on ? ' on' : '');
    if (on) { b.style.background = c.color; b.style.color = contrast(c.color); }
    b.innerHTML = '<span class="ce">' + catMark(c, 15, on ? contrast(c.color) : c.color) + '</span><span>' + esc(c.name) + '</span>';
    b.onclick = () => onPick(c.id);
    host.appendChild(b);
  });
  if (withNone) {
    const nb = document.createElement('button');
    nb.type = 'button';
    nb.className = 'cpill none' + (selectedId ? '' : ' on');
    nb.textContent = t('noCategory');
    nb.onclick = () => onPick(null);
    host.appendChild(nb);
  }
  if (withGhost) {
    const g = document.createElement('button');
    g.className = 'cpill ghost';
    g.innerHTML = '<span>+</span><span>' + esc(t('addCat')) + '</span>';
    g.onclick = () => { backToEvent = true; closeSheet('event'); openManage('cats'); };
    host.appendChild(g);
  }
}

/* ============================================================
   SHEET: DOGAĐAJ
   ============================================================ */
function openEvent(mode, logId, preset) {
  if (!liveCats().length) { openManage('cats'); return; }
  histOpen = false;
  evConflict = false;
  evId = logId || null;

  if (evId) {
    const l = logs.find(x => x.id === evId);
    if (!l) return;
    evMode = 'manual';
    evCat = l.catId;
    evS = new Date(l.startTime);
    evE = l.endTime ? new Date(l.endTime) : null;
    $('ev-name').value = l.title || '';
    $('ev-note').value = l.note || '';
    $('ev-title').textContent = t('evEdit');
    $('ev-del').classList.remove('hide');
  } else {
    evMode = mode || 'start';
    evCat = null;                      // nista nije predodabrano; default je upisati naslov
    $('ev-name').value = '';
    $('ev-note').value = '';
    $('ev-title').textContent = t('evNew');
    $('ev-del').classList.add('hide');
    applyModeDefaults();
    if (preset) {
      evS = new Date(preset.s);
      evE = preset.e ? new Date(preset.e) : null;
      normalizeEv();
    }
  }
  renderEvent();
  openSheet('event');
}

function applyModeDefaults() {
  const now = new Date();
  if (evMode === 'start') {
    evS = new Date(now); evS.setSeconds(0, 0); evE = null;
  } else if (evMode === 'end') {
    evE = new Date(now); evE.setSeconds(0, 0);
    /* Pocetak se po defaultu nastavlja na kraj prethodne aktivnosti. */
    const prev = prevEndBefore(+evE, evId);
    const gap = prev === null ? null : +evE - prev;
    evS = (gap !== null && gap >= 60000 && gap <= DAY_MS) ? new Date(prev) : new Date(+evE - 30 * 60000);
    evS.setSeconds(0, 0);
  }
  normalizeEv();
}
function normalizeEv() {
  if (!evE) return;
  const h = evE.getHours(), m = evE.getMinutes();
  const d = new Date(evS); d.setHours(h, m, 0, 0);
  if (d <= evS) d.setDate(d.getDate() + 1);
  evE = d;
}

function renderEvent() {
  $('ev-mode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === evMode));
  $('ev-date-fld').classList.toggle('hide', evMode !== 'manual');
  $('ev-quick-fld').classList.toggle('hide', (!quicks.length && !logs.length) || !!evId);

  catPills($('ev-cats'), evCat, id => { evCat = id; renderEvent(); }, true, true);

  const qr = $('ev-quick-row'); qr.innerHTML = '';
  if (logs.length) {
    const hb = document.createElement('button');
    hb.type = 'button';
    hb.className = 'qchip hist-btn' + (histOpen ? ' on' : '');
    hb.setAttribute('aria-label', t('history'));
    hb.innerHTML = HIST_ICON;
    hb.onclick = () => { histOpen = !histOpen; renderEvent(); };
    qr.appendChild(hb);
  }
  quicks.forEach(q => {
    const c = catOf(q.catId);
    const b = document.createElement('button');
    b.className = 'qchip'; b.style.setProperty('--qc', c.color);
    b.innerHTML = '<i class="qbar"></i><span class="qe">' + catMark(c, 15) + '</span><span>' + esc(q.name) + '</span>';
    b.onclick = () => { evCat = q.catId; $('ev-name').value = q.name; renderEvent(); };
    qr.appendChild(b);
  });

  renderHist();
  renderEvDays();
  syncTimes();
  renderSaveAs();
}

function renderEvDays() {
  const host = $('ev-days'); host.innerHTML = '';
  const base = parseYmd(ymd(evS));
  const today = ymd(new Date());
  const cur = ymd(evS);
  let selEl = null;
  for (let i = -4; i <= 3; i++) {
    const d = new Date(base); d.setDate(d.getDate() + i);
    const s = ymd(d);
    const b = document.createElement('button');
    b.className = 'mday' + (s === cur ? ' on' : '');
    const dt = new Date(); dt.setHours(0, 0, 0, 0);
    const diff = Math.round((+parseYmd(s) - +dt) / DAY_MS);
    const lbl = diff === 0 ? t('today') : diff === -1 ? t('yest') : diff === 1 ? t('tom')
      : d.toLocaleDateString(loc(), { weekday: 'short' }).replace('.', '');
    b.innerHTML = '<div class="a">' + esc(lbl) + '</div><div class="b">' + d.getDate() + '.' + (d.getMonth() + 1) + '.</div>';
    b.onclick = () => {
      const nd = parseYmd(s); nd.setHours(evS.getHours(), evS.getMinutes(), 0, 0);
      evS = nd; normalizeEv(); renderEvent();
    };
    host.appendChild(b);
    if (s === cur) selEl = b;
  }
  if (selEl) setTimeout(() => selEl.scrollIntoView({ block: 'nearest', inline: 'center' }), 0);
}

const HIST_ICON =
  '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" ' +
  'stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +

/* Vrijeme unosa u popisu povijesti: samo sat za danas, inace i datum. */
function histStamp(d) {
  const today = ymd(new Date());
  return ymd(d) === today ? fmtT(d) : d.getDate() + '.' + (d.getMonth() + 1) + '. ' + fmtT(d);
}

/* Popis od zadnje unesene aktivnosti prema starijima. */
function renderHist() {
  const box = $('ev-hist');
  if (!histOpen) { box.classList.add('hide'); box.innerHTML = ''; return; }
  const items = logs.slice(-12).reverse();
  box.classList.remove('hide');
  box.innerHTML = items.map(l => {
    const c = catOf(l.catId);
    const label = l.title ? esc(l.title) : '<em>' + esc(logLabel(l)) + '</em>';
    return '<button type="button" class="hist-i" data-id="' + l.id + '">' +
      '<i class="hb" style="background:' + c.color + '"></i>' +
      '<span class="he">' + catMark(c, 15) + '</span>' +
      '<span class="hn">' + label + '</span>' +
      '<span class="ht">' + esc(histStamp(new Date(l.startTime))) + '</span></button>';
  }).join('');
  box.querySelectorAll('.hist-i').forEach(b => b.onclick = () => {
    const l = logs.find(x => x.id === b.dataset.id);
    if (l) {
      if (liveCats().some(c => c.id === l.catId)) evCat = l.catId;
      $('ev-name').value = l.title || '';
    }
    histOpen = false;
    renderEvent();
  });
}

/* ---------- preklapanja ----------
   Model kaze: kad jedna aktivnost zavrsi, pocinje iduca. Zato se novi unos
   koji zadire u postojeci ne sprema tiho - osoba vidi koji bi se unos skratio
   i koliko bi trajao nakon promjene, pa sama bira hoce li to uciniti. */
function overlapPlan(startMs, endMs, exceptId) {
  const og = ongoingLog();
  const endEff = endMs === null ? startMs : endMs;
  const reach = Math.max(endEff, startMs + 1);
  const plan = [];
  for (const l of logs) {
    if (l.id === exceptId) continue;
    const ls = +new Date(l.startTime);
    /* Aktivnost u tijeku se prirodno zatvara na pocetku novog unosa - to nije sukob. */
    if (og && l.id === og.id && startMs >= ls) continue;
    const le = +effEnd(l);
    if (ls >= reach || le <= startMs) continue;

    let after = null, kind;
    if (ls < startMs) { kind = 'end'; after = startMs; }
    else if (endMs !== null && le > endEff) { kind = 'start'; after = endEff; }
    else { kind = 'gone'; }
    const before = (le - ls) / 60000;
    const rest = kind === 'end' ? (after - ls) / 60000
               : kind === 'start' ? (le - after) / 60000 : 0;
    plan.push({ log: l, kind: kind, at: after, before: before, rest: rest });
  }
  return plan;
}

function applyOverlapPlan(plan) {
  plan.forEach(p => {
    if (p.kind === 'end') {
      p.log.endTime = new Date(p.at).toISOString();
    } else if (p.kind === 'start') {
      p.log.startTime = new Date(p.at).toISOString();
      if (p.log.endTime && +new Date(p.log.endTime) <= p.at) p.log.endTime = '';
    } else {
      logs = logs.filter(x => x.id !== p.log.id);
    }
  });
  sortLogs();
}

function renderConflict() {
  const box = $('ev-conflict');
  const plan = overlapPlan(+evS, evE ? +evE : null, evId);
  const btn = $('ev-save');
  if (!plan.length) {
    evConflict = false;
    box.classList.add('hide'); box.innerHTML = '';
    box.classList.remove('attention');
    btn.disabled = false;
    btn.classList.remove('warn');
    btn.textContent = t('save');
    return;
  }
  /* Gumb se ne gasi. Ostaje pritisnjiv i vodi do uzroka. */
  evConflict = true;
  box.classList.remove('hide');
  btn.disabled = false;
  btn.classList.add('warn');
  btn.textContent = t('checkOverlap');
  box.innerHTML =
    '<div class="cf-h"><span>⚠</span><span>' + esc(t('conflict')) + '</span></div>' +
    plan.map(p => {
      const ls = new Date(p.log.startTime), le = effEnd(p.log);
      const oldR = fmtT(ls) + '–' + fmtT(le);
      const newR = p.kind === 'gone' ? t('vanishes')
        : p.kind === 'end' ? fmtT(ls) + '–' + fmtT(new Date(p.at))
                           : fmtT(new Date(p.at)) + '–' + fmtT(le);
      return '<div class="cf-l">' +
        '<div class="nm">' + esc(logLabel(p.log)) + '</div>' +
        '<div class="cf-when"><s>' + esc(oldR) + '</s><i>→</i><b>' + esc(newR) + '</b></div>' +
        (p.kind === 'gone' ? '' :
          '<div class="cf-dur">' + esc(fmtDur(p.before)) + ' → ' + esc(fmtDur(p.rest)) + '</div>') +
        '</div>';
    }).join('') +
    '<button type="button" class="cf-btn" id="ev-fix">' + esc(t('adjust')) + '</button>';

  $('ev-fix').onclick = () => {
    snap();
    applyOverlapPlan(overlapPlan(+evS, evE ? +evE : null, evId));
    save();
    renderEvent();
    renderAll();
    toast(t('adjusted'), true);
  };
}

/* Vidljivo samo dok naslov ili kategorija nedostaju - inace nema sto reci. */
function renderSaveAs() {
  const box = $('ev-saveas');
  const title = $('ev-name').value.trim();
  const cat = evCat ? cats.find(c => c.id === evCat) : null;
  if (title && cat) { box.classList.add('hide'); return; }
  box.classList.remove('hide');
  box.innerHTML = '<i>↳</i><span>' + esc(t('savedAs')) + ': <b>' +
    esc(title || t('untitled')) + ' · ' + esc(cat ? cat.name : t('noCategory')) + '</b></span>';
}

/* Gumb "nastavak od ..." - ujedno objasnjava zasto je pocetak takav kakav jest. */
function renderChain() {
  const el = $('ev-chain');
  const prev = prevEndBefore(+(evE || new Date()), evId);
  if (prev === null || evMode === 'start') { el.classList.add('hide'); return; }
  let owner = null;
  for (const l of logs) {
    if (l.id === evId) continue;
    if (Math.abs(+effEnd(l) - prev) < 1000) owner = l;
  }
  const name = owner ? logLabel(owner) : '';
  el.classList.remove('hide');
  el.classList.toggle('on', Math.abs(+evS - prev) < 60000);
  el.innerHTML = '<i>↳</i><span>' + fmtT(new Date(prev)) + (name ? ' · ' + esc(name) : '') + '</span>';
  el.onclick = () => { evS = new Date(prev); normalizeEv(); syncTimes(); };
}

function syncTimes() {
  $('ev-from').value = hm(evS);
  $('ev-to').value = evE ? hm(evE) : '';
  const box = $('ev-to').parentElement;
  box.classList.toggle('empty', !evE);
  $('t-ev-to').textContent = t('to') + (evE ? '' : ' · ' + t('openEnd'));
  $('t-ev-dur').textContent = evE ? fmtDur((evE - evS) / 60000) : '';
  renderChain();
  renderConflict();
}

/* Odvede pogled na upozorenje i nakratko ga istakne. */
function showConflict() {
  const box = $('ev-conflict');
  if (box.classList.contains('hide')) return;
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  box.classList.remove('attention');
  void box.offsetWidth;                       // ponovno pokretanje animacije
  box.classList.add('attention');
  setTimeout(() => box.classList.remove('attention'), 1300);
}

function saveEvent() {
  if (evConflict) { showConflict(); return; }
  snap();
  const rec = {
    title: $('ev-name').value.trim(),
    catId: evCat || '',
    startTime: evS.toISOString(),
    endTime: evE ? evE.toISOString() : '',
    note: $('ev-note').value.trim()
  };
  if (evId) {
    Object.assign(logs.find(l => l.id === evId), rec);
  } else {
    if (evMode === 'start') closeOngoing(+evS);
    logs.push(Object.assign({ id: uid() }, rec));
  }
  sortLogs(); save();
  selDay = ymd(evS);
  closeSheet('event');
  renderAll();
  toast(t('saved'), true);
}

/* Brisemo odmah i nudimo "Ponisti" - nativni confirm() u WebViewu zna biti progutan. */
function deleteEvent() {
  if (!evId) return;
  snap();
  logs = logs.filter(l => l.id !== evId);
  save(); closeSheet('event'); renderAll();
  toast(t('deleted'), true);
}

/* ============================================================
   SHEET: KATEGORIJE / BRZE RADNJE
   ============================================================ */
function openManage(tab) {
  mgTab = tab || 'cats';
  openPicker = null;
  renderManage();
  openSheet('manage');
}
function renderManage() {
  $('mg-seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === mgTab));
  $('mg-cats').classList.toggle('hide', mgTab !== 'cats');
  $('mg-quicks').classList.toggle('hide', mgTab !== 'quicks');
  renderSugg();
  renderCatList();
  renderQuickTab();
  renderDataSec();
}

function renderSugg() {
  /* Dok nema nijedne kategorije, oblacic izravno upucuje na prijedloge. */
  const wrap = $('sugg-wrap');
  let co = $('sugg-callout');
  if (!cats.length) {
    if (!co) {
      co = document.createElement('div');
      co.className = 'callout'; co.id = 'sugg-callout';
      wrap.parentElement.insertBefore(co, wrap);
    }
    co.innerHTML = '<span class="arw">\u2193</span><span>' + esc(t('tapSugg')) + '</span>';
  } else if (co) { co.remove(); }

  const row = $('sugg-row'); row.innerHTML = '';
  const names = t('sn');
  let shown = 0;
  names.forEach((nm, i) => {
    const meta = SUGG_META[i];
    const used = cats.some(c => c.name.trim().toLowerCase() === nm.toLowerCase());
    if (used) return;                      // vec dodano -> prijedlog nestaje
    const b = document.createElement('button');
    b.className = 'sugg' + (i === 0 ? ' lure' : '');
    b.style.setProperty('--lure', meta.c);
    b.innerHTML = '<span class="se">' + iconSvg(meta.i, 15, meta.c) + '</span>' + esc(nm);
    b.onclick = () => addFromSugg(nm, meta, b);
    row.appendChild(b);
    shown++;
  });
  $('sugg-wrap').classList.toggle('hide', shown === 0);
}
function addFromSugg(name, meta, btn) {
  btn.classList.add('gone');
  cats.push({ id: uid(), name: name, icon: meta.i, emoji: '', color: meta.c });
  save();
  renderCatList();
  $('manage-badge').textContent = liveCats().length;
  setTimeout(renderSugg, 300);
}

function nextColor() {
  const used = cats.map(c => c.color);
  return PALETTE.find(p => used.indexOf(p) < 0) || PALETTE[cats.length % PALETTE.length];
}

function renderCatList() {
  const host = $('cat-list'); host.innerHTML = '';
  if (!cats.length) {
    host.innerHTML = '<div class="tiny-empty">' + esc(t('noCats')).replace(/\n/g, '<br>') + '</div>';
    return;
  }
  cats.forEach(c => {
    const row = document.createElement('div');
    row.className = 'crow';

    const eb = document.createElement('button');
    eb.className = 'crow-e'; eb.innerHTML = catMark(c, 19);
    eb.onclick = () => togglePicker(c.id, 'mark');

    const inp = document.createElement('input');
    inp.className = 'crow-n'; inp.type = 'text'; inp.value = c.name;
    inp.placeholder = t('catPh'); inp.autocomplete = 'off';
    inp.oninput = () => { c.name = inp.value; save(); $('manage-badge').textContent = liveCats().length; };
    inp.onchange = () => { renderSugg(); renderAll(); };

    const cb = document.createElement('button');
    cb.className = 'crow-c'; cb.style.background = c.color;
    cb.onclick = () => togglePicker(c.id, 'color');

    const xb = document.createElement('button');
    xb.className = 'crow-x'; xb.textContent = '✕';
    xb.onclick = () => removeCat(c, row);

    row.append(eb, inp, cb, xb);
    host.appendChild(row);

    if (openPicker && openPicker.id === c.id) host.appendChild(buildPicker(c));
  });
}

function togglePicker(id, type) {
  openPicker = (openPicker && openPicker.id === id && openPicker.type === type) ? null : { id, type };
  renderCatList();
}

function buildPicker(c) {
  const box = document.createElement('div');
  box.className = 'picker';
  if (openPicker.type === 'color') {
    const g = document.createElement('div'); g.className = 'swatches';
    PALETTE.forEach(p => {
      const b = document.createElement('button');
      b.className = 'sw-b' + (p.toLowerCase() === (c.color || '').toLowerCase() ? ' on' : '');
      b.style.background = p;
      b.onclick = () => { c.color = p; save(); openPicker = null; renderCatList(); renderAll(); };
      g.appendChild(b);
    });
    box.appendChild(g);
  } else {
    const l1 = document.createElement('div');
    l1.className = 'pick-lbl'; l1.textContent = t('marks');
    box.appendChild(l1);
    const ig = document.createElement('div'); ig.className = 'ico-grid';
    ICON_KEYS.forEach(k => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ico-b' + (k === c.icon ? ' on' : '');
      b.innerHTML = iconSvg(k, 19, c.color);
      b.onclick = () => { c.icon = k; c.emoji = ''; save(); openPicker = null; renderCatList(); renderAll(); };
      ig.appendChild(b);
    });
    box.appendChild(ig);

    const l2 = document.createElement('div');
    l2.className = 'pick-lbl'; l2.textContent = 'Emoji';
    box.appendChild(l2);
    const g = document.createElement('div'); g.className = 'emo-grid';
    EMOJIS.filter(e => e !== '✨').forEach(e => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'emo-b' + (e === c.emoji ? ' on' : '');
      b.textContent = e;
      b.onclick = () => { c.emoji = e; c.icon = ''; save(); openPicker = null; renderCatList(); renderAll(); };
      g.appendChild(b);
    });
    box.appendChild(g);
  }
  return box;
}

function removeCat(c, row) {
  snap();
  row.classList.add('out');
  setTimeout(() => {
    cats = cats.filter(x => x.id !== c.id);
    quicks = quicks.filter(q => q.catId !== c.id);
    if (qCatSel === c.id) qCatSel = null;
    openPicker = null;
    save(); renderManage(); renderAll();
    toast(t('deleted') + (c.name ? ' · ' + c.name : ''), true);
  }, 210);
}

function addCustomCat() {
  cats.push({ id: uid(), name: '', icon: '', emoji: '', color: nextColor() });
  openPicker = null;
  renderCatList();
  const ins = $('cat-list').querySelectorAll('.crow-n');
  if (ins.length) ins[ins.length - 1].focus();
}

function pruneCats() {
  const before = cats.length;
  cats = cats.filter(c => c.name.trim());
  if (before !== cats.length) save();
}

/* ---------- brze radnje ---------- */
function renderQuickTab() {
  if (!qCatSel || !liveCats().some(c => c.id === qCatSel)) qCatSel = (liveCats()[0] || {}).id || null;
  catPills($('q-cats'), qCatSel, id => { qCatSel = id; renderQuickTab(); }, false);
  $('q-add').disabled = !($('q-name').value.trim() && qCatSel);

  const host = $('quick-list'); host.innerHTML = '';
  if (!quicks.length) {
    host.innerHTML = '<div class="tiny-empty">' + esc(t('noQuicks')) + '</div>';
    return;
  }
  quicks.forEach(q => {
    const c = catOf(q.catId);
    const row = document.createElement('div'); row.className = 'qrow';
    row.innerHTML = '<div class="qe" style="color:' + c.color + '">' + catMark(c, 17) + '</div>' +
      '<div class="qb"><div class="qn">' + esc(q.name) + '</div><div class="qc">' + esc(c.name) + '</div></div>';
    const x = document.createElement('button');
    x.className = 'crow-x'; x.textContent = '✕';
    x.onclick = () => { snap(); quicks = quicks.filter(z => z.id !== q.id); save(); renderQuickTab(); renderAll(); toast(t('deleted') + ' · ' + q.name, true); };
    row.appendChild(x);
    host.appendChild(row);
  });
}
function addQuick() {
  const n = $('q-name').value.trim();
  if (!n || !qCatSel) return;
  quicks.push({ id: uid(), name: n, catId: qCatSel, emoji: '' });
  $('q-name').value = '';
  save(); renderQuickTab(); renderAll();
}

/* ============================================================
   VEZANJE
   ============================================================ */
function bind() {
  $('btn-add').onclick = () => openEvent('start');
  $('btn-manage').onclick = () => openManage('cats');
  $('ob-btn').onclick = () => openManage('cats');
  $('btn-lang').onclick = () => { renderLangList(); openSheet('lang'); };
  $('quick-edit').onclick = () => openManage('quicks');

  $('tl-prev').onclick = () => stepPeriod(-1);
  $('tl-next').onclick = () => stepPeriod(1);
  $('tl-jump').onchange = e => {
    if (!e.target.value) return;
    selDay = e.target.value; ttDay = null;
    const back = Math.ceil((Date.now() - +parseYmd(selDay)) / DAY_MS) + 7;
    if (back > stripBack) stripBack = back;
    renderDayStrip(); renderTlNav(); renderTimeline();
  };
  $('tl-scale').querySelectorAll('button').forEach(b => b.onclick = () => {
    tlScale = b.dataset.s; LS.set('kr_scale', tlScale); ttDay = null;
    renderDayStrip(); renderTlNav(); renderTimeline();
  });
  /* Traka dana se sama produzuje kad dodes do njezina lijevog kraja. */
  $('daystrip').addEventListener('scroll', () => {
    if ($('daystrip').scrollLeft < 80) { stripBack += 30; renderDayStrip(true); }
  }, { passive: true });

  $('view-seg').querySelectorAll('button').forEach(b => b.onclick = () => {
    view = b.dataset.v;
    $('view-seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    $('view-tl').classList.toggle('hide', view !== 'tl');
    $('view-an').classList.toggle('hide', view !== 'an');
    if (view !== 'tl' && tlFull) setTimelineFull(false);
    $('tl-nav').classList.toggle('hide', view !== 'tl');
    view === 'tl' ? renderTimeline() : renderAnalytics();
  });

  $('ev-mode').querySelectorAll('button').forEach(b => b.onclick = () => {
    evMode = b.dataset.m; applyModeDefaults(); renderEvent();
  });
  $('ev-edit-cats').onclick = () => { backToEvent = true; closeSheet('event'); openManage('cats'); };
  $('ev-save').onclick = saveEvent;
  $('ev-name').oninput = renderSaveAs;
  $('ev-del').onclick = deleteEvent;
  $('ev-from').onchange = () => {
    const v = $('ev-from').value; if (!v) return;
    const [h, m] = v.split(':').map(Number);
    evS = new Date(evS); evS.setHours(h, m, 0, 0);
    normalizeEv(); syncTimes();
  };
  $('ev-to').onchange = () => {
    const v = $('ev-to').value;
    if (!v) { evE = null; } else {
      const [h, m] = v.split(':').map(Number);
      evE = new Date(evS); evE.setHours(h, m, 0, 0);
      normalizeEv();
    }
    syncTimes();
  };

  $('mg-seg').querySelectorAll('button').forEach(b => b.onclick = () => { mgTab = b.dataset.t; openPicker = null; renderManage(); });
  $('btn-add-cat').onclick = addCustomCat;
  $('mg-done').onclick = () => closeSheet('manage');
  $('q-name').oninput = () => { $('q-add').disabled = !($('q-name').value.trim() && qCatSel); };
  $('q-name').onkeydown = e => { if (e.key === 'Enter') addQuick(); };
  $('q-add').onclick = addQuick;

  $('toast-act').onclick = undo;
  $('toast-x').onclick = hideToast;

  document.querySelectorAll('[data-close]').forEach(e => e.onclick = () => closeSheet(e.dataset.close));

  window.addEventListener('scroll', () => {
    $('hdr').classList.toggle('scrolled', window.scrollY > 4);
  }, { passive: true });

  window.addEventListener('resize', () => { fitTimetable(); applyZoom(); if (bubOn) placeBubble(); }, { passive: true });
  window.addEventListener('hashchange', routeMockup);

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const open = document.querySelectorAll('.sheet.on');
    if (open.length) { open.forEach(s => closeSheet(s.id.replace('sheet-', ''))); return; }
    if (tlFull) setTimelineFull(false);
  });

  // osvježi vremensku crtu kad se aplikacija vrati u prvi plan
  document.addEventListener('visibilitychange', () => { if (!document.hidden) renderAll(); });
}

/* Kategorije i brze radnje iz stvarnih podataka, a ako ih nema — primjer. */
function mkData() {
  const c = liveCats();
  const demo = [
    { id: 'd0', name: t('sn')[0], icon: SUGG_META[0].i, color: SUGG_META[0].c },
    { id: 'd1', name: t('sn')[1], icon: SUGG_META[1].i, color: SUGG_META[1].c },
    { id: 'd2', name: t('sn')[2], icon: SUGG_META[2].i, color: SUGG_META[2].c },
    { id: 'd3', name: t('sn')[3], icon: SUGG_META[3].i, color: SUGG_META[3].c }
  ];
  const cats = c.length ? c.slice(0, 5) : demo;
  const qs = quicks.length
    ? quicks.slice(0, 3).map(q => ({ name: q.name, c: catOf(q.catId) }))
    : [{ name: '☕ ' + t('sn')[2], c: cats[2] || cats[0] }, { name: t('sn')[3], c: cats[3] || cats[0] }];
  return { cats: cats, quicks: qs, live: ongoingLog() };
}

/* Popis za mockup: stvarni unosi ako postoje, inace primjer. */
function mkHist() {
  if (logs.length) {
    return logs.slice(-5).reverse().map(l => {
      const c = catOf(l.catId);
      return { e: catMark(c, 15), c: c.color, n: logLabel(l), plain: !l.title, s: histStamp(new Date(l.startTime)) };
    });
  }
  const n = t('sn'), m = SUGG_META;
  return [
    { e: iconSvg(m[3].i, 15, m[3].c), c: m[3].c, n: n[3], s: '18:40' },
    { e: iconSvg(m[2].i, 15, m[2].c), c: m[2].c, n: n[2], s: '13:05' },
    { e: iconSvg(m[1].i, 15, m[1].c), c: m[1].c, n: n[1], s: '09:15' },
    { e: iconSvg(m[0].i, 15, m[0].c), c: m[0].c, n: n[0], plain: true, s: '23:30' }
  ];
}

function mkWidget(state) {
  const d = mkData();
  const og = state === 'live' ? (d.live || { catId: null, title: null, startTime: new Date(Date.now() - 2535000).toISOString() }) : null;
  const c = og ? (d.live ? catOf(og.catId) : d.cats[3] || d.cats[0]) : null;

  let head = '<div class="mk-w-head"><i class="mk-w-mark"></i><span class="mk-w-name">Kronos</span>' +
             '<span class="mk-w-right">' + fmtT(new Date()) + '</span></div>';

  let live = '';
  if (og) {
    const el = clockDur(Date.now() - +new Date(og.startTime));
    live = '<div class="mk-w-live" style="--live:' + c.color + '">' +
      '<i class="mk-w-dot"></i><span class="e">' + catMark(c, 16, 'currentColor') + '</span>' +
      '<span class="n">' + esc(logLabel(og)) + '</span>' +
      '<span class="t">' + el + '</span></div>';
  }

  const endLabel = og ? t('nowStop') : t('mEnd');
  const trio = '<div class="mk-w-trio">' +
    '<button class="mk-btn start" data-m="start"><span class="ic">' + MK_ICON.start + '</span><span class="tx">' + esc(t('mStart')) + '</span></button>' +
    '<button class="mk-btn mid" data-m="manual"><span class="ic" style="color:var(--text-2)">' + MK_ICON.mid + '</span><span class="tx">' + esc(t('mManual')) + '</span></button>' +
    '<button class="mk-btn end' + (og ? ' strong' : '') + '" data-m="end"><span class="ic" style="color:var(--accent)">' + MK_ICON.end + '</span><span class="tx">' + esc(endLabel) + '</span></button>' +
    '</div>';

  return '<div class="mk-widget">' + head + live + trio + '</div>';
}

function mkPanel() {
  const d = mkData();
  const og = d.live;
  const now = new Date();
  let icon, title, timeMain, timeSub;

  if (mkMode === 'start') {
    icon = '<span class="ic" style="background:rgba(31,184,92,.15)">' + MK_ICON.start + '</span>';
    title = t('mStart');
    timeMain = fmtT(now) + ' →';
    timeSub = t('openEnd');
  } else if (mkMode === 'end') {
    const prev = prevEndBefore(+now, null);
    const from = og ? new Date(og.startTime) : (prev !== null ? new Date(prev) : new Date(+now - 1800000));
    icon = '<span class="ic" style="background:var(--accent-soft);color:var(--accent)">' + MK_ICON.end + '</span>';
    title = og ? t('nowStop') : t('mEnd');
    timeMain = fmtT(from) + '–' + fmtT(now);
    timeSub = fmtDur((now - from) / 60000);
  } else {
    icon = '<span class="ic" style="background:var(--surface-3);color:var(--text-2)">' + MK_ICON.mid + '</span>';
    title = t('evNew');
    timeMain = fmtT(now);
    timeSub = t('evDate');
  }

  const rowN = (n, label, opt) =>
    '<div class="mk-row-n"><b>' + n + '</b><span>' + esc(label) + '</span>' +
    (opt ? '<span class="opt">' + esc(mkT('optional')) + '</span>' : '') + '</div>';

  const catChips = d.cats.map(c =>
    '<button class="mk-chip"><span>' + catMark(c, 15) + '</span><span>' + esc(c.name) + '</span></button>').join('') +
    '<button class="mk-chip none">' + esc(t('noCategory')) + '</button>';

  const quickChips = d.quicks.map(q =>
    '<button class="mk-chip"><i class="b" style="background:' + q.c.color + '"></i><span>' + esc(q.name) + '</span></button>').join('');

  return '<div class="mk-panel">' +
    '<div class="mk-p-head">' + icon + '<span class="mk-p-title">' + esc(title) + '</span>' +
      '<span class="mk-p-time">' + esc(timeMain) + '<small>' + esc(timeSub) + '</small></span></div>' +
    '<div class="mk-rows">' +
      '<div class="mk-row">' + rowN(1, mkT('r1'), true) + '<div class="mk-fake-inp">' + esc(t('namePh')) + '</div></div>' +
      '<div class="mk-row">' + rowN(2, mkT('r2'), true) + '<div class="mk-chips">' + catChips + '</div></div>' +
      '<div class="mk-row">' + rowN(3, mkT('r3'), true) +
        '<div class="mk-chips"><button class="mk-chip hist-btn' + (mkHistOpen ? ' on' : '') +
          '" id="mk-hist-btn" aria-label="' + esc(t('history')) + '">' + HIST_ICON + '</button>' + quickChips + '</div>' +
        (mkHistOpen ? '<div class="hist" style="margin-top:10px">' + mkHist().map(h =>
            '<span class="hist-i">' +
            '<i class="hb" style="background:' + h.c + '"></i>' +
            '<span class="he">' + h.e + '</span>' +
            '<span class="hn">' + (h.plain ? '<em>' + esc(h.n) + '</em>' : esc(h.n)) + '</span>' +
            '<span class="ht">' + esc(h.s) + '</span></span>').join('') + '</div>' : '') +
      '</div>' +
      '<div class="mk-row">' + rowN(4, mkT('r4'), true) + '<div class="mk-fake-inp">' + esc(t('notePh')) + '</div></div>' +
      (mkMode === 'manual' ? '<div class="mk-row" style="color:var(--text-3);font-size:12.5px;line-height:1.5">' + esc(mkT('full')) + '</div>' : '') +
    '</div>' +
    '<div class="mk-preview"><i>↳</i><span>' + esc(mkT('willSave')) + ': <b>' + esc(t('untitled')) + ' · ' + esc(t('noCategory')) + '</b></span></div>' +
    '<button class="mk-save">' + esc(t('save')) + '</button>' +
    '</div>';
}

function renderMockup() {
  const host = $('mockup');
  host.innerHTML =
    '<div class="mk-top"><button class="mk-back" id="mk-back">← ' + esc(mkT('back')) + '</button>' +
      '<span class="mk-h1">' + esc(mkT('h1')) + '</span></div>' +
    '<p class="mk-lead">' + esc(mkT('lead')) + '</p>' +

    '<div class="mk-sec"><div class="mk-label">' + esc(mkT('rest')) + '</div>' +
      '<div class="mk-wall"><div class="mk-wall-time">' + fmtT(new Date()) + '</div>' +
      mkWidget('idle') +
      '<div class="mk-dock"><i></i><i></i><i></i><i></i></div></div></div>' +

    '<div class="mk-sec"><div class="mk-label">' + esc(mkT('live')) + '</div>' +
      mkWidget('live') +
      '<div class="mk-cap">' + esc(t('nowStop')) + ' preuzima desni gumb i postaje istaknut.</div></div>' +

    '<div class="mk-sec"><div class="mk-label">' + esc(mkT('exp')) + ' — ' + esc(mkT('tap')) + '</div>' +
      '<div class="mk-widget" style="box-shadow:var(--sh-1);border:1px solid var(--line);margin-bottom:12px" id="mk-switch"></div>' +
      '<div id="mk-panel-host"></div>' +
      '<div class="mk-cap">' + esc(mkT('noteTitle')) + '</div></div>' +

    '<div class="mk-sec"><div class="mk-label">' + esc(mkT('constraints')) + '</div>' +
      '<div class="mk-note"><span class="k ok">DA</span><span><b>Tri gumba u widgetu.</b> iOS 17+ preko App Intents, Android preko RemoteViews.</span></div>' +
      '<div class="mk-note"><span class="k ok">DA</span><span><b>Jedan dodir bez otvaranja aplikacije</b> za brzu radnju s već poznatom kategorijom.</span></div>' +
      '<div class="mk-note"><span class="k ok">DA</span><span><b>Živi brojač u widgetu</b> i na zaključanom zaslonu (Live Activity).</span></div>' +
      '<div class="mk-note"><span class="k no">NE</span><span><b>Unos teksta unutar widgeta.</b> Proširenje se otvara u aplikaciji, koju dodir na gumb otvara točno na tom koraku.</span></div>' +
    '</div>';

  $('mk-back').onclick = () => { location.hash = ''; };
  $('mk-switch').innerHTML = mkWidget('idle').replace(/^<div class="mk-widget">|<\/div>$/g, '');
  mkBindTrio();
  $('mk-panel-host').innerHTML = mkPanel();

  host.querySelectorAll('.mk-wall .mk-btn, #mk-switch .mk-btn').forEach(b => {
    b.onclick = () => { mkMode = b.dataset.m; renderMockup(); };
  });
  const hb = $('mk-hist-btn');
  if (hb) hb.onclick = () => { mkHistOpen = !mkHistOpen; renderMockup(); };
}
function mkBindTrio() {
  const sw = $('mk-switch');
  if (!sw) return;
  sw.querySelectorAll('.mk-btn').forEach(b => b.classList.toggle('on', b.dataset.m === mkMode));
}

/* --- usmjeravanje --- */
function routeMockup() {
  const on = location.hash === '#widget';
  if (on) document.querySelectorAll('.sheet.on').forEach(sh => closeSheet(sh.id.replace('sheet-', '')));
  document.querySelector('.app').classList.toggle('hide', on);
  $('mockup').classList.toggle('hide', !on);
  if (on) { stopTick(); renderMockup(); }
  else { renderAll(); }
}

/* ============================================================
   START
   ============================================================ */
(async function init() {
  await Store.open();
  await migrateStore();
  await loadData();
  selDay = ymd(new Date());
  applyLang();
  bind();
  renderAll();
  if (location.hash === '#widget') routeMockup();
  setInterval(() => { if (!document.hidden && view === 'tl' && selDay === ymd(new Date())) renderTimeline(); }, 60000);
})();

</script>
</body>
</html>
