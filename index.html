/* ============================================================
   KRONOS — dizajn tokeni
   ============================================================ */
:root{
  --bg:#F1F1EE;
  --surface:#FBFBFA;
  --surface-2:#EBEBE7;
  --surface-3:#DFDFD9;
  --text:#101215;
  --text-2:#5A5D58;
  --text-3:#93958F;
  --line:#DEDED9;
  --line-2:#EAEAE5;
  /* U ovom smjeru naglasak je tinta, ne boja. Signalna crvena je rezervirana
     iskljucivo za trenutno vrijeme i za upozorenja. */
  --accent:#101215;
  --accent-2:#101215;
  --accent-soft:rgba(16,18,21,.07);
  --accent-text:#101215;
  --danger:#C4351E;
  --danger-soft:rgba(196,53,30,.09);
  /* Tipografija. Skala: 11 / 12 / 13 / 15 / 17 / 20 / 30.
     Debljine: 400 regular, 500 medium, 600 semibold, 700 bold, 800 extrabold.
     Polja za unos nikad ispod 16px - inace iOS zumira stranicu pri fokusu. */
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r-lg:4px;
  --r-md:3px;
  --r-sm:3px;
  --sh-1:none;
  --sh-2:0 -1px 0 var(--line), 0 -18px 44px rgba(12,14,18,.16);
  --sh-accent:none;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A0A0B;
    --surface:#141516;
    --surface-2:#1D1E20;
    --surface-3:#2A2B2D;
    --text:#EFEFEC;
    --text-2:#9A9C97;
    --text-3:#6C6E6A;
    --line:#282A2B;
    --line-2:#1E1F21;
    --accent:#EFEFEC;
    --accent-2:#EFEFEC;
    --accent-soft:rgba(239,239,236,.10);
    --accent-text:#EFEFEC;
    --danger:#E4553B;
    --danger-soft:rgba(228,85,59,.14);
    --sh-1:none;
    --sh-2:0 -1px 0 var(--line), 0 -18px 48px rgba(0,0,0,.6);
    --sh-accent:none;
  }
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
  font-weight:400;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-size-adjust:100%;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
/* Brojke su glavni sadrzaj ove aplikacije - dobivaju vlastiti rez. */
.tt-hour b,.tt-now b,.time-box input,.dday .dn,.stat b,.donut-c b,.an-li .vl,
.bar-top .bv,.bar-top .bp,.now-time,.hist-i .ht,.cf-when,.cf-dur,.dur-note,
.tt-m,.mday .b,.badge,.brand-sub{font-family:var(--font-num);letter-spacing:-.01em}
button{border:none;background:none;cursor:pointer}
input{border:none;outline:none;background:none}
::-webkit-scrollbar{width:0;height:0}
.hide{display:none !important}

/* ============================================================
   Ljuska aplikacije
   ============================================================ */
.app{max-width:520px;margin:0 auto;min-height:100%;background:var(--bg);position:relative}
@media(min-width:560px){
  body{background:var(--surface-2)}
  .app{box-shadow:0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.10);min-height:100vh}
}

/* HEADER */
.hdr{
  position:sticky;top:0;z-index:60;
  padding:calc(var(--safe-t) + 10px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bg);
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.hdr.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:30px;height:30px;border-radius:3px;flex:none;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  box-shadow:var(--sh-accent);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.brand-mark i{
  position:absolute;width:13px;height:13px;border:1.9px solid #fff;border-radius:50%;opacity:.95;
}
.brand-mark i::after{
  content:"";position:absolute;left:50%;top:50%;width:1.8px;height:5px;background:#fff;border-radius:2px;
  transform-origin:50% 100%;transform:translate(-50%,-100%);
  animation:tick 24s steps(24,end) infinite;
}
@keyframes tick{to{transform:translate(-50%,-100%) rotate(360deg)}}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-.022em;line-height:1.05}
.brand-sub{font-size:11px;color:var(--text-3);font-weight:500;letter-spacing:0;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px}
.icon-btn{
  height:36px;min-width:36px;padding:0 11px;border-radius:3px;
  background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:15px;font-weight:600;color:var(--text-2);
  transition:transform .12s, background .15s;
}
.icon-btn:active{transform:scale(.93)}

/* MAIN */
.main{padding:2px 16px calc(40px + var(--safe-b))}

/* ============================================================
   Dvije glavne tipke
   ============================================================ */
.actions{display:flex;flex-direction:column;gap:8px;margin:2px 0 14px}
.btn-hero{
  height:52px;border-radius:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-size:17px;font-weight:700;letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:var(--sh-accent);
  transition:transform .13s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
}
.btn-hero:active{transform:scale(.965);box-shadow:0 3px 10px rgba(74,92,245,.28)}
.btn-hero .plus{
  width:25px;height:25px;border-radius:3px;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:300;line-height:0;
}
.btn-sub{
  height:42px;border-radius:3px;padding:0 13px;
  background:var(--surface);border:1px solid var(--line);
  color:var(--text);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--sh-1);
  transition:transform .13s, background .15s;
}
.btn-sub:active{transform:scale(.97);background:var(--surface-2)}
.btn-sub .ico{font-size:15px}
.btn-sub .badge{
  font-size:11px;font-weight:700;color:var(--text-3);
  background:var(--surface-2);border-radius:3px;padding:2px 8px;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   Onboarding
   ============================================================ */
.onboard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:24px 20px;text-align:center;box-shadow:var(--sh-1);margin-bottom:14px;
  animation:rise .45s cubic-bezier(.22,1,.36,1);
}
.onboard .oe{font-size:30px;line-height:1;margin-bottom:10px}
.onboard h3{font-size:17px;font-weight:700;letter-spacing:-.015em;margin-bottom:6px}
.onboard p{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:16px}
.onboard button{
  height:44px;padding:0 22px;border-radius:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-weight:700;font-size:15px;box-shadow:var(--sh-accent);
}
.onboard button:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============================================================
   "Sada" kartica
   ============================================================ */
.now{
  border-radius:var(--r-lg);padding:11px 12px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--sh-1);border:1px solid var(--line);
  background:var(--surface);position:relative;overflow:hidden;
}
.now.live{border-color:transparent;color:#fff;box-shadow:var(--sh-2)}
.now.live::before{content:"";position:absolute;inset:0;background:var(--live-c,#4A5CF5);z-index:0}
.now.live::after{
  content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(115deg,rgba(255,255,255,.22),rgba(255,255,255,0) 58%);
}
.now > *{position:relative;z-index:1}
.now-emoji{
  width:40px;height:40px;flex:none;border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  background:var(--surface-2);
}
.now.live .now-emoji{background:rgba(255,255,255,.20)}
.now-body{flex:1;min-width:0}
.now-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.6;display:flex;align-items:center;gap:6px}
.now.live .now-label{opacity:.88}
.now-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:beat 1.7s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.75)}}
.now-title{font-size:17px;font-weight:700;letter-spacing:-.015em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-time{font-size:13px;opacity:.78;font-weight:500;font-variant-numeric:tabular-nums}
.now-stop{
  flex:none;height:40px;padding:0 15px;border-radius:3px;font-weight:700;font-size:13px;
  background:rgba(255,255,255,.24);color:#fff;
}
.now-stop:active{transform:scale(.94)}
.now-cta{flex:none;height:36px;padding:0 14px;border-radius:3px;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:13px}
.now-cta:active{transform:scale(.94)}

/* ============================================================
   Brze radnje (chips)
   ============================================================ */
.block{margin-bottom:12px}
.row-label{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin:0 2px 6px;
}
.row-label button{font-size:12px;font-weight:700;color:var(--accent-text);text-transform:none;letter-spacing:0;white-space:nowrap}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px}
.qchip{
  flex:none;display:flex;align-items:center;gap:9px;
  height:40px;padding:0 13px 0 11px;border-radius:3px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);
  font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text);
  transition:transform .13s;
}
.qchip:active{transform:scale(.94)}
.qchip .qe{font-size:17px;line-height:1}
.qchip .qbar{width:3px;height:19px;border-radius:2px;background:var(--qc,#888);flex:none}
.qchip.ghost{border-style:dashed;color:var(--text-3);font-weight:600;background:transparent;box-shadow:none}

/* ============================================================
   Traka dana
   ============================================================ */
/* Navigacija kalendara: strelice, skok na datum, dan ili tjedan. */
.tl-nav{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.tl-arrow{
  width:32px;height:32px;flex:none;border-radius:3px;background:var(--surface);
  border:1px solid var(--line);color:var(--text-2);font-size:17px;font-weight:700;line-height:1;
}
.tl-arrow:active{transform:scale(.92)}
.tl-date-wrap{position:relative;flex:1;min-width:0;display:block}
.tl-date{
  width:100%;height:32px;border-radius:3px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:700;letter-spacing:-.01em;
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;
}
.tl-date-wrap input[type=date]{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;
  border:none;padding:0;cursor:pointer;
}
.tl-scale{flex:none;width:132px;padding:2px}
.tl-scale button{padding:6px 4px;font-size:12px}

/* ---------- widget na glavnom ekranu ---------- */
.wdg{display:flex;align-items:center;gap:7px}
.wdg-b{
  width:54px;height:54px;flex:none;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  transition:transform .12s, background .18s;
}
.wdg-b:active{transform:scale(.93)}
.wdg-b.mid{background:var(--accent);color:var(--bg);border-color:transparent}
.wdg-sw{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}
.wdg-sw span{
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);text-align:right;line-height:1.25;max-width:64px;
}
.sw{width:42px;height:24px;border-radius:12px;background:var(--surface-3);position:relative;flex:none;transition:background .2s}
.sw i{
  position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--surface);display:block;transition:transform .22s cubic-bezier(.3,1.3,.5,1);
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(18px)}

/* ---------- lebdeci gumb ---------- */
.bub-wrap{position:fixed;z-index:300;touch-action:none;user-select:none;-webkit-user-select:none}
.bub-row{display:flex;align-items:center}
.bub{
  width:48px;height:48px;flex:none;border-radius:3px;
  background:var(--accent);color:var(--bg);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 12px rgba(0,0,0,.32);cursor:grab;
}
.bub-wrap.drag .bub{cursor:grabbing;transform:scale(1.06)}
.bub-side{
  width:44px;height:44px;flex:none;border-radius:3px;
  background:var(--surface);color:var(--text);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.22);
  opacity:0;margin:0 -22px;transform:scale(.55);pointer-events:none;
  transition:opacity .2s, transform .3s cubic-bezier(.22,1.35,.42,1), margin .3s cubic-bezier(.22,1.35,.42,1);
}
.bub-wrap.open .bub-side{opacity:1;margin:0 5px;transform:scale(1);pointer-events:auto}
.bub-drop{
  position:fixed;left:50%;bottom:calc(34px + var(--safe-b));z-index:299;
  width:56px;height:56px;border-radius:50%;
  background:rgba(16,18,21,.6);color:#fff;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translate(-50%,22px);pointer-events:none;
  transition:opacity .2s, transform .22s, background .18s;
}
.bub-drop.on{opacity:1;transform:translate(-50%,0)}
.bub-drop.hot{background:var(--danger);transform:translate(-50%,0) scale(1.18)}

/* ---------- oblacic koji upucuje na prijedloge ---------- */
.callout{
  position:relative;margin:0 2px 14px;padding:10px 13px;border-radius:3px;
  background:var(--accent);color:var(--bg);
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;
  animation:coIn .42s cubic-bezier(.22,1,.36,1);
}
.callout::after{
  content:"";position:absolute;left:24px;bottom:-5px;width:11px;height:11px;
  background:var(--accent);transform:rotate(45deg);
}
.callout .arw{animation:nudge 1.5s ease-in-out infinite;flex:none}
@keyframes coIn{from{opacity:0;transform:translateY(-7px)}}
@keyframes nudge{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
.onboard button.pulse{animation:obPulse 2.6s ease-in-out infinite}
@keyframes obPulse{
  0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}
  45%{box-shadow:0 0 0 8px color-mix(in srgb, var(--accent) 0%, transparent)}
}

.daystrip{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px}
.dday.inweek{border-color:var(--accent);background:var(--accent-soft)}

/* Prikaz tjedna */
.tt.wk-mode{padding-top:0}
.wk-head{
  display:grid;grid-template-columns:repeat(7,1fr);gap:3px;
  margin-left:54px;padding:10px 0 8px;position:sticky;top:0;z-index:6;
  background:var(--surface);
}
.wk-d{padding:2px 0 3px;border-radius:3px;text-align:center;line-height:1.15}
.wk-d .a{display:block;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.wk-d .b{display:block;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.wk-d.today .b{color:var(--accent-text)}
.wk-d.today{background:var(--accent-soft)}
.wk-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wk-col{position:relative;min-width:0}
.wk-col.today{background:color-mix(in srgb, var(--accent) 5%, transparent);border-radius:3px}
.tt-ev.wk{padding:0;border-radius:2px;align-items:center;box-shadow:none}
.tt-ev.wk .tt-t{font-size:11px;text-align:center;line-height:1}
.tt-ev.wk.micro .tt-t{display:none}
.dday{
  flex:none;width:46px;padding:6px 0 7px;border-radius:3px;text-align:center;
  background:var(--surface);border:1px solid var(--line);
  transition:transform .13s, background .18s, border-color .18s;
}
.dday:active{transform:scale(.93)}
.dday .dw{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.dday .dn{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:1px;font-variant-numeric:tabular-nums}
.dday .ddot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin:3px auto 0;opacity:0}
.dday.has .ddot{opacity:.55}
.dday.today .dn{color:var(--accent-text)}
.dday.sel{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:var(--sh-accent)}
.dday.sel .dw,.dday.sel .dn{color:#fff}
.dday.sel .ddot{background:#fff;opacity:.9}

/* ============================================================
   Segmentirani prekidač
   ============================================================ */
.seg{
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;
  background:var(--surface-2);padding:3px;border-radius:3px;
}
.seg button{
  padding:8px 6px;border-radius:3px;font-size:13px;font-weight:600;color:var(--text-2);
  transition:color .18s, background .18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.seg.sm button{padding:7px 5px;font-size:13px}

/* ============================================================
   Timetable
   ============================================================ */
.tt{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px 12px 16px 0;box-shadow:var(--sh-1);position:relative;
  max-height:520px;
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
}

/* fader za zumiranje - jedina kontrola ispod kalendara */
.zoomer{display:flex;align-items:center;gap:14px;padding:14px 8px 0}
.zi{flex:none;width:12px;height:2px;background:var(--text-3);border-radius:2px;opacity:.5}
.zi.s{box-shadow:0 -3px 0 var(--text-3), 0 3px 0 var(--text-3)}
.zi.l{box-shadow:0 -7px 0 var(--text-3), 0 7px 0 var(--text-3)}
#tt-zoom{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:30px;background:transparent}
#tt-zoom::-webkit-slider-runnable-track{height:5px;border-radius:2px;background:var(--surface-3)}
#tt-zoom::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;margin-top:-10.5px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);
}
#tt-zoom::-moz-range-track{height:5px;border-radius:2px;background:var(--surface-3);border:none}
#tt-zoom::-moz-range-thumb{
  width:24px;height:24px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);
}
.tt-grid{position:relative;margin-left:54px}
.tt-hour{position:absolute;left:0;right:0;border-top:1px solid var(--line-2)}
.tt-hour b{
  position:absolute;left:-54px;top:-8px;width:44px;text-align:right;
  font-size:11px;font-weight:600;color:var(--text-3);font-variant-numeric:tabular-nums;
}
.tt-ev{
  position:absolute;border-radius:3px;padding:6px 10px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  display:flex;flex-direction:column;justify-content:center;
  transition:transform .12s;
}
/* Ulazna animacija samo pri prvom prikazu dana - ne na svakom osvjezavanju. */
.tt-grid.anim .tt-ev{animation:evin .34s cubic-bezier(.22,1,.36,1) backwards}
@keyframes evin{from{opacity:0;transform:translateX(-8px)}}
.tt-ev:active{transform:scale(.98)}
.tt-ev.open{box-shadow:0 0 0 1.5px rgba(255,255,255,.45) inset, 0 1px 4px rgba(0,0,0,.12)}
.tt-t{font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-m{font-size:11px;font-weight:500;opacity:.82;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-ev.tiny{padding:2px 9px}
.tt-ev.tiny .tt-t{font-size:12px}
.tt-ev.tiny .tt-m{display:none}
.tt-ev.micro{padding:0 6px;border-radius:3px;box-shadow:none}
.tt-ev.micro .tt-t,.tt-ev.micro .tt-m{display:none}
.tt-hour.nolabel b{display:none}
/* Prazan slot: proziran, neaktivan pravokutnik koji vodi u novi unos
   s vec upisanim vremenom te rupe. */
.tt-gap{
  position:absolute;left:0;right:0;border-radius:3px;
  border:1.5px dashed var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);font-size:17px;font-weight:400;line-height:1;
  transition:background .15s, border-color .15s, color .15s;
}
.tt-gap:active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.tt-gap span{opacity:.5}
.tt-gap.micro{border-radius:3px}
.tt-gap.micro span{display:none}

.tt-now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:5;pointer-events:none;border-radius:2px}
.tt-now::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.tt-now b{
  position:absolute;left:-54px;top:-9px;width:46px;text-align:right;
  font-size:11px;font-weight:800;color:var(--danger);font-variant-numeric:tabular-nums;
  background:var(--surface);border-radius:2px;padding:1px 2px 1px 0;
}

/* Prosirenje kalendara preko cijelog zaslona.
   Tipka za prosirenje je tiha, tipka za povratak nije. */
.tt-exp{
  width:30px;height:30px;flex:none;border-radius:3px;
  border:1px solid var(--line);background:var(--surface);color:var(--text-3);
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s, color .16s, border-color .16s;
}
.tt-exp:active{transform:scale(.9);color:var(--text);border-color:var(--text-3)}
.tt-collapse{
  width:100%;height:48px;margin-top:10px;flex:none;border-radius:3px;
  background:var(--accent);color:var(--bg);
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:15px;font-weight:600;letter-spacing:-.01em;
  transition:transform .12s;
}
.tt-collapse:active{transform:scale(.985)}

body.tl-full{overflow:hidden}
body.tl-full .hdr,
body.tl-full .actions,
body.tl-full #onboard,
body.tl-full #now,
body.tl-full #quick-block,
body.tl-full .daystrip,
body.tl-full #view-seg{display:none}
body.tl-full .main{
  height:100dvh;display:flex;flex-direction:column;
  padding-top:calc(var(--safe-t) + 10px);
  padding-bottom:calc(var(--safe-b) + 10px);
}
body.tl-full #tl-nav{flex:none}
body.tl-full #view-tl{flex:1;min-height:0;display:flex;flex-direction:column}
body.tl-full .tt{flex:1;min-height:0;max-height:none}
body.tl-full .zoomer{flex:none}

/* prazno stanje */
.empty{
  text-align:center;padding:44px 24px;color:var(--text-3);
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);
}
.empty .e{font-size:30px;margin-bottom:10px;opacity:.85}
.empty p{font-size:13px;font-weight:500;line-height:1.5}

/* ============================================================
   Analitika
   ============================================================ */
.an-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 14px;box-shadow:var(--sh-1);margin-bottom:10px;
}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut{width:120px;height:120px;flex:none;border-radius:50%;position:relative}
.donut::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--surface)}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.donut-c b{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.12;text-align:center;font-variant-numeric:tabular-nums}
.donut-c small{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.an-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.an-li{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.an-li .sw{width:9px;height:9px;border-radius:2px;flex:none}
.an-li .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.an-li .vl{font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-2);font-size:13px}

.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;align-items:center;gap:8px;font-size:13px}
.bar-top .be{font-size:15px}
.bar-top .bn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.bar-top .bv{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.bar-top .bp{font-size:12px;font-weight:600;color:var(--text-3);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.bar-track{height:7px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.22,1,.36,1)}

.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:11px 7px;text-align:center;box-shadow:var(--sh-1)}
.stat b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}

/* ============================================================
   Bottom sheet
   ============================================================ */
.scrim{
  position:fixed;inset:0;z-index:200;background:rgba(8,10,16,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .28s ease;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:201;
  max-width:520px;margin:0 auto;
  background:var(--surface);
  border-radius:28px 28px 0 0;
  box-shadow:var(--sh-2);
  transform:translateY(101%);
  transition:transform .38s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;
  max-height:94dvh;
}
.sheet.on{transform:translateY(0)}
.grab{padding:9px 0 3px;display:flex;justify-content:center;flex:none}
.grab i{width:38px;height:4.5px;border-radius:2px;background:var(--surface-3);display:block}
.sheet-hd{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:5px 20px 12px;
}
.sheet-hd h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sheet-hd .sub{font-size:13px;color:var(--text-3);font-weight:500;margin-top:1px}
.x{
  width:32px;height:32px;flex:none;border-radius:50%;background:var(--surface-2);
  color:var(--text-2);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;
}
.x:active{transform:scale(.9)}
.sheet-bd{flex:1;overflow-y:auto;padding:0 20px 8px;-webkit-overflow-scrolling:touch}
.sheet-ft{
  flex:none;padding:12px 20px calc(14px + var(--safe-b));
  border-top:1px solid var(--line-2);
  background:var(--surface);
  display:flex;gap:9px;align-items:center;
}
.sheet-ft .btn-main{
  flex:1;height:48px;border-radius:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-size:15px;font-weight:700;box-shadow:var(--sh-accent);
  transition:transform .13s, opacity .2s;
}
.sheet-ft .btn-main:active{transform:scale(.97)}
.sheet-ft .btn-main:disabled{opacity:.4;box-shadow:none;pointer-events:none}
.sheet-ft .btn-del{
  width:48px;height:48px;flex:none;border-radius:3px;
  background:var(--danger-soft);color:var(--danger);font-size:17px;
  display:flex;align-items:center;justify-content:center;
}
.sheet-ft .btn-del:active{transform:scale(.94)}
.sheet-ft .btn-quiet{
  flex:1;height:48px;border-radius:3px;background:var(--surface-2);
  color:var(--text);font-size:15px;font-weight:700;
}

/* ============================================================
   Forma
   ============================================================ */
.fld{margin-bottom:14px}
.fld-lbl{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin:0 2px 8px;
}
.fld-lbl .opt{font-weight:600;letter-spacing:.02em;text-transform:none;font-size:11px;opacity:.85}
.fld-lbl button{font-size:12px;font-weight:700;color:var(--accent-text);text-transform:none;letter-spacing:0}
.inp{
  width:100%;height:46px;padding:0 14px;border-radius:3px;
  background:var(--surface-2);border:1.5px solid transparent;
  font-size:17px;font-weight:500;transition:border-color .18s, background .18s;
}
.inp::placeholder{color:var(--text-3);font-weight:400}
.inp:focus{border-color:var(--accent);background:var(--surface)}
textarea.inp{height:auto;min-height:60px;padding:12px 14px;resize:none;line-height:1.45;font-size:17px;font-weight:400}

/* Kategorije u formi */
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cpill{
  display:flex;align-items:center;gap:7px;
  height:38px;padding:0 13px 0 10px;border-radius:3px;
  background:var(--surface-2);border:1.5px solid transparent;
  font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text);
  transition:transform .13s, box-shadow .2s, background .2s;
}
.cpill .ce{display:flex;align-items:center;line-height:1}
.ico{display:block;flex:none}
.mk-emoji{display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:none}
.mk-mono{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  border:1.4px solid currentColor;border-radius:2px;font-weight:600;letter-spacing:-.02em;
}
.ico-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:9px}
.ico-b{
  height:38px;border-radius:2px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;transition:transform .12s;
}
.ico-b:active{transform:scale(.88)}
.ico-b.on{background:var(--accent-soft);box-shadow:0 0 0 1.4px var(--accent)}
.pick-lbl{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin:2px 0 7px;
}
.tt-t{display:flex;align-items:center;gap:5px}
.tt-t em{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stat b.stat-mk{display:flex;align-items:center;justify-content:center;height:24px}
.cpill:active{transform:scale(.94)}
.cpill.on{color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);border-color:transparent}
.cpill.ghost{border:1.5px dashed var(--line);background:transparent;color:var(--text-3);font-weight:700}
.cpill.none{border:1.5px dashed var(--line);background:transparent;color:var(--text-3)}
.cpill.none.on{background:var(--text-3);border-color:transparent;color:var(--surface);box-shadow:none}

/* Upozorenje na preklapanje: imenuje unos koji se skracuje i njegovo novo trajanje. */
.conflict{
  margin:0 0 14px;padding:12px 13px 11px;border-radius:3px;
  background:var(--danger-soft);border:1px solid transparent;
}
.cf-h{
  display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--danger);margin-bottom:9px;
}
.cf-l{padding:8px 0}
.cf-l + .cf-l{border-top:1px solid color-mix(in srgb, var(--danger) 18%, transparent)}
.cf-l .nm{
  font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cf-when{
  display:flex;align-items:baseline;gap:7px;margin-top:3px;flex-wrap:wrap;
  font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);
}
.cf-when s{opacity:.5;text-decoration:line-through;font-weight:600}
.cf-when i{font-style:normal;opacity:.6;font-weight:600}
.cf-when b{color:var(--danger);font-weight:800}
.cf-dur{
  margin-top:2px;font-size:11.5px;font-weight:600;color:var(--text-2);
  font-variant-numeric:tabular-nums;opacity:.9;
}
/* Gumb u stanju upozorenja: nije potvrda, nije opasnost - poziv da pogledas. */
.sheet-ft .btn-main.warn{
  background:var(--danger-soft);
  color:var(--danger);
  box-shadow:inset 0 0 0 1.5px var(--danger);
}
.sheet-ft .btn-main.warn:active{transform:scale(.97)}

/* Kratko skretanje paznje kad te gumb dovede do uzroka. */
.conflict.attention{animation:cfAttn 1.15s cubic-bezier(.22,1,.36,1)}
@keyframes cfAttn{
  0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--danger) 38%, transparent);transform:translateY(0)}
  16%{transform:translateY(-3px)}
  34%{transform:translateY(0)}
  100%{box-shadow:0 0 0 14px color-mix(in srgb, var(--danger) 0%, transparent);transform:translateY(0)}
}
@media (prefers-reduced-motion: reduce){
  .conflict.attention{animation:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--danger) 30%, transparent)}
}

.cf-btn{
  margin-top:10px;height:36px;padding:0 15px;border-radius:3px;
  background:var(--danger);color:#fff;font-size:13.5px;font-weight:700;
}
.cf-btn:active{transform:scale(.96)}

/* Pretpregled naziva - pokazuje pod cime ce unos zavrsiti ako polja ostanu prazna. */
.save-as{
  display:flex;align-items:center;gap:9px;
  margin:0 0 14px;padding:11px 13px;border-radius:3px;
  background:var(--accent-soft);color:var(--accent-text);
  font-size:13px;line-height:1.45;font-weight:600;
}
.save-as i{font-style:normal;opacity:.75;flex:none}
.save-as b{font-weight:800}

/* Vrijeme */
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.time-box{
  background:var(--surface-2);border:1.5px solid transparent;border-radius:3px;
  padding:9px 13px 10px;transition:border-color .18s;
}
.time-box:focus-within{border-color:var(--accent);background:var(--surface)}
.time-box small{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin-bottom:1px}
.time-box input{
  width:100%;font-size:20px;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;background:transparent;
}
.time-box input::-webkit-calendar-picker-indicator{opacity:.35;margin:0}
.time-box.empty small{color:var(--text-3)}
.time-box .ph{font-size:15px;font-weight:500;color:var(--text-3);padding:2px 0 3px}

/* Povijest: mali pravokutnik s popisom, od najnovijeg prema starijem.
   Otvara se u tijeku retka (ne preko njega) da ostane vidljiv i ostatak forme. */
.hist{
  margin-top:9px;border:1px solid var(--line);border-radius:3px;
  background:var(--surface);overflow:hidden;max-height:236px;overflow-y:auto;
  box-shadow:var(--sh-1);animation:pick .2s ease;
}
.hist-i{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 12px;text-align:left;
}
.hist-i + .hist-i{border-top:1px solid var(--line-2)}
.hist-i:active{background:var(--surface-2)}
.hist-i .hb{width:3px;height:20px;border-radius:2px;flex:none}
.hist-i .he{font-size:15px;line-height:1;flex:none}
.hist-i .hn{
  flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hist-i .hn em{font-style:normal;color:var(--text-3);font-weight:500}
.hist-i .ht{
  font-size:11px;font-weight:600;color:var(--text-3);
  font-variant-numeric:tabular-nums;flex:none;
}
.qchip.hist-btn{padding:0 12px;gap:0;color:var(--text-2)}
.qchip.hist-btn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}

.chain{
  display:inline-flex;align-items:center;gap:7px;margin-top:9px;
  height:34px;padding:0 12px;border-radius:3px;
  background:var(--surface-2);color:var(--text-2);
  font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
  transition:transform .12s, background .18s, color .18s;
  max-width:100%;overflow:hidden;white-space:nowrap;
}
.chain:active{transform:scale(.95)}
.chain.on{background:var(--accent-soft);color:var(--accent-text)}
.chain i{font-style:normal;opacity:.75}

.dur-note{
  font-size:12px;font-weight:800;letter-spacing:0;text-transform:none;
  color:var(--accent-text);font-variant-numeric:tabular-nums;
}

/* Datum u sheetu */
.mini-days{display:flex;gap:6px;overflow-x:auto;padding:1px 20px 2px;margin:0 -20px}
.mday{
  flex:none;min-width:46px;padding:7px 9px;border-radius:3px;text-align:center;
  background:var(--surface-2);transition:transform .12s;
}
.mday:active{transform:scale(.93)}
.mday .a{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase}
.mday .b{font-size:15px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.mday.on{background:var(--accent);color:#fff}
.mday.on .a{color:rgba(255,255,255,.8)}

/* ============================================================
   Uređivač kategorija
   ============================================================ */
.sugg-head{
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin:0 2px 9px;
}
.sugg-wrap{
  background:var(--surface-2);border-radius:3px;padding:13px 13px 12px;margin-bottom:18px;
}
.sugg-row{display:flex;flex-wrap:wrap;gap:7px}
.sugg{
  display:inline-flex;align-items:center;gap:6px;
  height:36px;padding:0 12px 0 10px;border-radius:3px;
  background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:-.01em;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1), opacity .25s, border-color .2s, color .2s;
  position:relative;
}
.sugg .se{font-size:15px;line-height:1;filter:saturate(.85)}
.sugg:active{transform:scale(.92)}
.sugg.used{opacity:.34;pointer-events:none}
.sugg.gone{animation:suggGo .3s cubic-bezier(.22,1,.36,1) forwards}
@keyframes suggGo{to{opacity:0;transform:scale(.75);margin-right:-6px}}

/* suptilna animacija na prijedlogu "Spavanje" */
.sugg.lure{
  color:var(--text);font-weight:700;
  border-color:color-mix(in srgb, var(--lure,#5E5CE6) 40%, var(--line));
  animation:lure 3.4s ease-in-out infinite;
}
.sugg.lure .se{filter:none}
@keyframes lure{
  0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--lure,#5E5CE6) 0%, transparent);transform:none}
  38%{box-shadow:0 0 0 5px color-mix(in srgb, var(--lure,#5E5CE6) 13%, transparent);transform:translateY(-1.5px)}
  62%{box-shadow:0 0 0 9px color-mix(in srgb, var(--lure,#5E5CE6) 0%, transparent);transform:none}
}
.sugg-hint{font-size:12px;color:var(--text-3);margin-top:11px;line-height:1.45;font-weight:400;padding:0 2px}

/* red kategorije */
.crow{
  display:flex;align-items:center;gap:10px;
  padding:7px 10px;border-radius:3px;background:var(--surface-2);
  margin-bottom:7px;
  animation:crowin .34s cubic-bezier(.22,1,.36,1) backwards;
}
@keyframes crowin{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.crow.out{animation:crowout .24s ease forwards}
@keyframes crowout{to{opacity:0;transform:scale(.94);margin-bottom:-52px;height:0;padding:0}}
.crow-e{
  width:36px;height:36px;flex:none;border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  background:var(--surface);border:1px solid var(--line);
  transition:transform .12s;
}
.crow-e:active{transform:scale(.9)}
.crow-n{
  flex:1;min-width:0;height:34px;font-size:17px;font-weight:600;letter-spacing:-.01em;
  background:transparent;border-bottom:1.5px solid transparent;transition:border-color .18s;
}
.crow-n:focus{border-bottom-color:var(--accent)}
.crow-n::placeholder{color:var(--text-3);font-weight:400}
.crow-c{
  width:26px;height:26px;flex:none;border-radius:3px;
  box-shadow:0 0 0 1.5px var(--surface), 0 0 0 3px var(--line);
  transition:transform .12s;
}
.crow-c:active{transform:scale(.86)}
.crow-x{
  width:30px;height:30px;flex:none;border-radius:3px;color:var(--text-3);
  font-size:15px;display:flex;align-items:center;justify-content:center;
}
.crow-x:active{transform:scale(.88);color:var(--danger)}

/* paleta / emoji picker */
.picker{
  grid-column:1/-1;background:var(--surface);border:1px solid var(--line);
  border-radius:3px;padding:11px;margin:-3px 0 9px;
  animation:pick .22s ease;
}
@keyframes pick{from{opacity:0;transform:translateY(-5px)}}
.swatches{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.sw-b{width:31px;height:31px;border-radius:3px;transition:transform .13s}
.sw-b:active{transform:scale(.85)}
.sw-b.on{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--text)}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.emo-b{height:34px;border-radius:3px;font-size:20px;background:var(--surface-2);transition:transform .12s}
.emo-b:active{transform:scale(.85)}
.emo-b.on{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent)}
.emo-free{
  width:100%;height:38px;margin-top:8px;border-radius:3px;background:var(--surface-2);
  text-align:center;font-size:17px;font-weight:500;
}

.add-custom{
  width:100%;height:46px;border-radius:3px;margin-top:2px;
  border:1.5px dashed var(--line);color:var(--text-2);
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .13s, border-color .2s, color .2s;
}
.add-custom:active{transform:scale(.97)}

/* ---------- podaci: izvoz i uvoz ---------- */
.data-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.data-b{
  height:44px;border-radius:3px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;font-weight:600;color:var(--text);transition:transform .12s, background .15s;
}
.data-b:active{transform:scale(.97);background:var(--surface-2)}
.data-mode{
  font-family:var(--font-num);font-size:10.5px;font-weight:500;letter-spacing:0;
  text-transform:none;color:var(--text-3);
}
.data-note{
  margin-top:9px;font-family:var(--font-num);font-size:11px;color:var(--text-3);
  letter-spacing:.02em;
}

.tiny-empty{
  text-align:center;padding:26px 16px;color:var(--text-3);
  font-size:13px;font-weight:500;line-height:1.5;
}

/* brze radnje u uređivaču */
.qrow{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:3px;
  background:var(--surface-2);margin-bottom:8px;
  animation:crowin .34s cubic-bezier(.22,1,.36,1) backwards;
}
.qrow .qe{
  width:38px;height:38px;flex:none;border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;
}
.qrow .qb{flex:1;min-width:0}
.qrow .qn{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .qc{font-size:12px;font-weight:500;color:var(--text-3)}
.qadd{display:flex;gap:8px;margin-bottom:12px}
.qadd .inp{flex:1;height:46px}
.qadd button{
  width:46px;height:46px;flex:none;border-radius:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-size:20px;font-weight:300;display:flex;align-items:center;justify-content:center;
  transition:transform .13s, opacity .2s;
}
.qadd button:active{transform:scale(.92)}
.qadd button:disabled{opacity:.35;pointer-events:none}

/* jezici */
.lang-list{display:flex;flex-direction:column;gap:4px;padding-bottom:8px}
.lang-i{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:3px;
  font-size:15px;font-weight:600;background:transparent;transition:background .15s;
  width:100%;text-align:left;
}
.lang-i:active{background:var(--surface-2)}
.lang-i.on{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.lang-i .fl{font-size:20px}
.lang-i .ck{margin-left:auto;font-size:15px;font-weight:800}

/* ============================================================
   Toast
   ============================================================ */
.toast{
  position:fixed;left:50%;bottom:calc(22px + var(--safe-b));z-index:400;
  transform:translate(-50%, calc(100% + 40px));
  max-width:420px;width:calc(100% - 32px);
  background:var(--text);color:var(--bg);
  border-radius:3px;padding:10px 10px 10px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--sh-2);
  font-size:13px;font-weight:600;
  transition:transform .4s cubic-bezier(.22,1,.36,1), bottom .25s ease;
}
.toast.on{transform:translate(-50%,0)}
.toast .tt-msg{flex:1;min-width:0}
/* Toast je tamna ploha; sve na njoj mora uzeti boju plohe ispod, ne naglasak. */
.toast button{
  flex:none;font-size:13px;font-weight:800;color:var(--bg);
  padding:4px 2px;text-decoration:underline;text-underline-offset:3px;
}
.toast .tt-x{
  width:24px;height:24px;border-radius:3px;padding:0;
  display:flex;align-items:center;justify-content:center;
  opacity:.5;font-weight:700;text-decoration:none;
  transition:opacity .15s;
}
.toast .tt-x:active{opacity:1}
/* Dok je sheet otvoren, toast se digne iznad njegova podnozja da ne prekrije Spremi. */
body.sheet-open .toast{bottom:calc(96px + var(--safe-b))}

/* ============================================================
   Pristupačnost
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.05s !important}
  .sugg.lure{box-shadow:0 0 0 3px color-mix(in srgb, var(--lure,#5E5CE6) 15%, transparent)}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

@media(max-width:360px){
  .btn-hero{height:54px;font-size:15px}
  .cpill{height:40px;font-size:13px}
  .donut{width:104px;height:104px}
  .stat b{font-size:15px}
}

/* ============================================================
   MOCKUP WIDGETA  (#widget)  — prikaz za dizajn, nije dio aplikacije
   ============================================================ */
#mockup{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 18px calc(56px + var(--safe-b))}
.mk-top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.mk-back{
  height:34px;padding:0 13px;border-radius:3px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--text-2);
}
.mk-back:active{transform:scale(.95)}
.mk-h1{font-size:20px;font-weight:800;letter-spacing:-.022em}
.mk-lead{font-size:14px;color:var(--text-2);line-height:1.55;margin-bottom:28px}

.mk-sec{margin-bottom:34px}
.mk-label{
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin:0 2px 10px;
}
.mk-cap{font-size:12.5px;color:var(--text-3);line-height:1.5;margin-top:10px;padding:0 2px}

/* --- simulirani početni zaslon --- */
.mk-wall{
  border-radius:3px;padding:20px 16px 22px;
  background:linear-gradient(150deg,#4b3f7a,#2b3f6b 55%,#1d2a49);
  box-shadow:var(--sh-2);
}
:root[data-theme="light"] .mk-wall{background:linear-gradient(150deg,#6f63a8,#4a63a0 55%,#31456f)}
.mk-wall-time{
  color:rgba(255,255,255,.92);font-size:34px;font-weight:300;letter-spacing:-.02em;
  text-align:center;margin-bottom:14px;font-variant-numeric:tabular-nums;
}

/* --- sam widget --- */
.mk-widget{
  background:var(--surface);border-radius:3px;padding:11px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);
}
.mk-w-head{
  display:flex;align-items:center;gap:8px;
  padding:1px 4px 9px;min-height:22px;
}
.mk-w-mark{
  width:15px;height:15px;border-radius:2px;flex:none;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
}
.mk-w-name{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--text-3);text-transform:uppercase}
.mk-w-right{
  margin-left:auto;font-size:11.5px;font-weight:700;color:var(--text-3);
  font-variant-numeric:tabular-nums;
}

/* traka aktivnosti u tijeku */
.mk-w-live{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:3px;margin-bottom:9px;
  color:#fff;background:var(--live,#4A5CF5);
}
.mk-w-live .e{font-size:16px}
.mk-w-live .n{font-size:13.5px;font-weight:700;letter-spacing:-.01em;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-w-live .t{margin-left:auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.95}
.mk-w-dot{width:6px;height:6px;border-radius:50%;background:#fff;flex:none;animation:beat 1.7s ease-in-out infinite}

/* tri dijela — jedan objekt podijeljen na tri */
.mk-w-trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.mk-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:12px 4px 10px;border-radius:3px;background:var(--surface-2);
  transition:transform .12s, background .18s, box-shadow .18s;
}
.mk-btn:active{transform:scale(.95)}
.mk-btn .ic{
  width:26px;height:26px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
}
.mk-btn .tx{font-size:11.5px;font-weight:700;letter-spacing:-.01em;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mk-btn.start .ic{background:rgba(31,184,92,.15)}
.mk-btn.end   .ic{background:var(--accent-soft)}
.mk-btn.mid   .ic{background:var(--surface-3)}
.mk-btn.on{background:var(--surface);box-shadow:0 0 0 1.5px var(--accent) inset}
.mk-btn.on .tx{color:var(--text)}
.mk-btn.strong{background:var(--accent)}
.mk-btn.strong .tx{color:#fff}
.mk-btn.strong .ic{background:rgba(255,255,255,.22)}

/* red ikona ispod widgeta, samo za dojam */
.mk-dock{display:flex;justify-content:center;gap:16px;margin-top:18px}
.mk-dock i{width:38px;height:38px;border-radius:3px;background:rgba(255,255,255,.16);display:block}

/* --- proširenje --- */
.mk-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);overflow:hidden;
}
.mk-p-head{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--line-2);
}
.mk-p-head .ic{width:24px;height:24px;border-radius:3px;display:flex;align-items:center;justify-content:center;flex:none}
.mk-p-title{font-size:15px;font-weight:700;letter-spacing:-.015em}
.mk-p-time{
  margin-left:auto;font-size:12.5px;font-weight:700;color:var(--accent-text);
  font-variant-numeric:tabular-nums;text-align:right;line-height:1.3;
}
.mk-p-time small{display:block;font-size:10.5px;font-weight:600;color:var(--text-3)}

.mk-rows{padding:4px 16px 14px}
.mk-row{padding:13px 0;border-bottom:1px solid var(--line-2)}
.mk-row:last-child{border-bottom:none}
.mk-row-n{
  display:flex;align-items:center;gap:7px;
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:8px;
}
.mk-row-n b{
  font-size:9.5px;width:15px;height:15px;border-radius:2px;flex:none;
  background:var(--surface-2);color:var(--text-3);
  display:flex;align-items:center;justify-content:center;font-weight:700;
}
.mk-row-n .opt{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;font-size:10.5px;opacity:.8}
.mk-fake-inp{
  height:42px;border-radius:3px;background:var(--surface-2);
  display:flex;align-items:center;padding:0 13px;
  font-size:15px;color:var(--text-3);font-weight:500;
}
.mk-chips{display:flex;flex-wrap:wrap;gap:6px}
.mk-chip{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;
  border-radius:3px;background:var(--surface-2);
  font-size:13.5px;font-weight:600;color:var(--text);letter-spacing:-.01em;
  transition:transform .12s;
}
.mk-chip:active{transform:scale(.94)}
.mk-chip.on{color:#fff}
.mk-chip.none{border:1.5px dashed var(--line);background:transparent;color:var(--text-3)}
.mk-chip.hist-btn{padding:0 10px;gap:0;color:var(--text-2)}
.mk-chip.hist-btn.on{background:var(--accent-soft);color:var(--accent-text)}
.mk-panel .hist-i{cursor:default}
.mk-chip .b{width:3px;height:16px;border-radius:2px;flex:none}

.mk-preview{
  display:flex;align-items:center;gap:9px;
  margin:0 16px 14px;padding:11px 13px;border-radius:3px;
  background:var(--accent-soft);
  font-size:13px;line-height:1.45;color:var(--accent-text);font-weight:600;
}
.mk-preview i{font-style:normal;opacity:.75;flex:none}
.mk-save{
  margin:0 16px 16px;height:46px;width:calc(100% - 32px);border-radius:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-size:15.5px;font-weight:700;box-shadow:var(--sh-accent);
}
.mk-save:active{transform:scale(.98)}

/* --- napomene --- */
.mk-note{
  display:grid;grid-template-columns:22px 1fr;gap:11px;
  padding:13px 0;border-top:1px solid var(--line);
  font-size:13.5px;line-height:1.55;color:var(--text-2);
}
.mk-note b{color:var(--text);font-weight:700}
.mk-note .k{
  font-size:9.5px;font-weight:800;letter-spacing:.04em;
  width:22px;height:19px;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--text-3);
}
.mk-note .k.ok{background:rgba(31,184,92,.15);color:#0d8f47}
.mk-note .k.no{background:var(--danger-soft);color:var(--danger)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .mk-note .k.ok{color:#3FBF8F}
}

</style>
</head>
<body>
<div class="app">

  <header class="hdr" id="hdr">
    <div class="brand">
      <div class="brand-mark"><i></i></div>
      <div>
        <div class="brand-name">my24</div>
        <div class="brand-sub" id="hdr-sub"></div>
      </div>
    </div>
    <div class="hdr-right">
      <button class="icon-btn" id="btn-lang" aria-label="Language"><span id="lang-flag">🇭🇷</span></button>
    </div>
  </header>

  <main class="main">

    <!-- DVIJE GLAVNE TIPKE -->
    <div class="actions">
      <button class="btn-hero" id="btn-add">
        <span class="plus">+</span><span id="t-add"></span>
      </button>
      <button class="btn-sub" id="btn-manage">
        <span class="ico">◎</span><span id="t-manage"></span><span class="badge" id="manage-badge">0</span>
      </button>
    </div>

    <!-- ONBOARDING (bez kategorija) -->
    <div class="onboard hide" id="onboard">
      <div class="oe">⏱️</div>
      <h3 id="ob-h"></h3>
      <p id="ob-p"></p>
      <button id="ob-btn"></button>
    </div>

    <!-- SADA -->
    <div class="now hide" id="now"></div>

    <!-- BRZE RADNJE -->
    <div class="block hide" id="quick-block">
      <div class="row-label">
        <span id="t-quicks"></span>
        <button id="quick-edit"></button>
      </div>
      <div class="wdg" id="wdg"></div>
    </div>

    <!-- NAVIGACIJA KALENDARA -->
    <div class="tl-nav hide" id="tl-nav">
      <button class="tl-arrow" id="tl-prev" aria-label="&lt;">&#8249;</button>
      <span class="tl-date-wrap">
        <button class="tl-date" id="tl-date"></button>
        <input type="date" id="tl-jump" aria-label="datum">
      </span>
      <button class="tl-arrow" id="tl-next" aria-label="&gt;">&#8250;</button>
      <div class="seg sm tl-scale" id="tl-scale">
        <button data-s="day" id="t-sc-day"></button>
        <button data-s="week" id="t-sc-week"></button>
      </div>
    </div>

    <!-- DANI -->
    <div class="daystrip" id="daystrip"></div>

    <!-- PRIKAZ -->
    <div class="seg" id="view-seg" style="margin-bottom:14px">
      <button data-v="tl" class="on" id="t-view-tl"></button>
      <button data-v="an" id="t-view-an"></button>
    </div>

    <section id="view-tl"></section>
    <section id="view-an" class="hide"></section>

  </main>
</div>

<!-- Mockup widgeta; prikazuje se samo na #widget -->
<div id="mockup" class="hide"></div>

<!-- ============================ SHEET: DOGAĐAJ ============================ -->
<div class="scrim" id="scrim-event" data-close="event"></div>
<div class="sheet" id="sheet-event" role="dialog" aria-modal="true">
  <div class="grab" data-close="event"><i></i></div>
  <div class="sheet-hd">
    <div>
      <h2 id="ev-title"></h2>
    </div>
    <button class="x" data-close="event">✕</button>
  </div>
  <div class="sheet-bd">

    <!-- NAČIN -->
    <div class="fld">
      <div class="seg" id="ev-mode">
        <button data-m="start" id="t-m-start"></button>
        <button data-m="end" id="t-m-end"></button>
        <button data-m="manual" id="t-m-manual"></button>
      </div>
    </div>

    <!-- 1. NASLOV -->
    <div class="fld">
      <div class="fld-lbl"><span id="t-ev-name"></span></div>
      <input class="inp" id="ev-name" type="text" autocomplete="off">
    </div>

    <!-- 2. KATEGORIJA -->
    <div class="fld">
      <div class="fld-lbl">
        <span id="t-ev-cat"></span>
        <button id="ev-edit-cats"></button>
      </div>
      <div class="cats" id="ev-cats"></div>
    </div>

    <!-- 3. RANIJE POSTAVLJENI DOGAĐAJ -->
    <div class="fld hide" id="ev-quick-fld">
      <div class="fld-lbl"><span id="t-ev-quick"></span></div>
      <div class="hscroll" id="ev-quick-row" style="padding-left:20px;padding-right:20px;margin:0 -20px"></div>
      <div class="hist hide" id="ev-hist"></div>
    </div>

    <!-- 4. OPIS -->
    <div class="fld">
      <div class="fld-lbl"><span id="t-ev-note"></span></div>
      <textarea class="inp" id="ev-note" rows="2"></textarea>
    </div>

    <!-- DATUM -->
    <div class="fld hide" id="ev-date-fld">
      <div class="fld-lbl"><span id="t-ev-date"></span></div>
      <div class="mini-days" id="ev-days"></div>
    </div>

    <!-- VRIJEME -->
    <div class="fld">
      <div class="fld-lbl"><span id="t-ev-time"></span><span class="dur-note" id="t-ev-dur"></span></div>
      <div class="time-row">
        <div class="time-box"><small id="t-ev-from"></small><input type="time" id="ev-from"></div>
        <div class="time-box"><small id="t-ev-to"></small><input type="time" id="ev-to"></div>
      </div>
      <button class="chain hide" id="ev-chain" type="button"></button>
    </div>

    <div class="conflict hide" id="ev-conflict"></div>
    <div class="save-as hide" id="ev-saveas"></div>
    <div style="height:4px"></div>
  </div>
  <div class="sheet-ft">
    <button class="btn-del hide" id="ev-del">🗑</button>
    <button class="btn-main" id="ev-save"></button>
  </div>
</div>

<!-- ============================ SHEET: KATEGORIJE / BRZE RADNJE ============================ -->
<div class="scrim" id="scrim-manage" data-close="manage"></div>
<div class="sheet" id="sheet-manage" role="dialog" aria-modal="true">
  <div class="grab" data-close="manage"><i></i></div>
  <div class="sheet-hd">
    <div>
      <h2 id="mg-title"></h2>
    </div>
    <button class="x" data-close="manage">✕</button>
  </div>
  <div class="sheet-bd">
    <div class="seg" id="mg-seg" style="margin-bottom:18px">
      <button data-t="cats" class="on" id="t-tab-cats"></button>
      <button data-t="quicks" id="t-tab-quicks"></button>
    </div>

    <!-- TAB: KATEGORIJE -->
    <div id="mg-cats">
      <div class="sugg-wrap" id="sugg-wrap">
        <div class="sugg-head" id="t-sugg"></div>
        <div class="sugg-row" id="sugg-row"></div>
      </div>
      <div class="fld-lbl" style="margin-bottom:9px"><span id="t-your-cats"></span></div>
      <div id="cat-list"></div>
      <button class="add-custom" id="btn-add-cat"><span>+</span><span id="t-add-cat"></span></button>
      <div style="height:10px"></div>
    </div>

    <!-- TAB: BRZE RADNJE -->
    <div id="mg-quicks" class="hide">
      <div class="qadd">
        <input class="inp" id="q-name" type="text" autocomplete="off">
        <button id="q-add" disabled>+</button>
      </div>
      <div class="fld-lbl" style="margin-bottom:9px"><span id="t-q-cat"></span></div>
      <div class="cats" id="q-cats" style="margin-bottom:20px"></div>
      <div class="fld-lbl" style="margin-bottom:9px"><span id="t-q-list"></span></div>
      <div id="quick-list"></div>
      <div style="height:10px"></div>
    </div>

    <!-- PODACI -->
    <div id="mg-data" style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)"></div>
  </div>
  <div class="sheet-ft">
    <button class="btn-main" id="mg-done"></button>
  </div>
</div>

<!-- ============================ SHEET: JEZIK ============================ -->
<div class="scrim" id="scrim-lang" data-close="lang"></div>
<div class="sheet" id="sheet-lang" role="dialog" aria-modal="true">
  <div class="grab" data-close="lang"><i></i></div>
  <div class="sheet-hd">
    <h2 id="lg-title"></h2>
    <button class="x" data-close="lang">✕</button>
  </div>
  <div class="sheet-bd"><div class="lang-list" id="lang-list"></div></div>
</div>

<div class="bub-drop" id="bub-drop"></div>
<div class="bub-wrap hide" id="bub"></div>

<div class="toast" id="toast">
  <span class="tt-msg" id="toast-msg"></span>
  <button id="toast-act"></button>
  <button class="tt-x" id="toast-x" aria-label="X">&#10005;</button>
</div>

const UNITS = { zh: ['小时', '分钟'], ja: ['時間', '分'], ru: ['ч', 'мин'] };
function fmtDur(mins) {
  const m = Math.max(0, Math.round(mins)), h = Math.floor(m / 60), r = m % 60;
  const u = UNITS[lang] || ['h', 'min'];
  const sp = (lang === 'zh' || lang === 'ja') ? '' : ' ';
  if (h && r) return h + sp + u[0] + ' ' + r + sp + u[1];
  if (h) return h + sp + u[0];
  return r + sp + u[1];
}
function durParts(mins) {
  const m = Math.max(0, Math.round(mins)), h = Math.floor(m / 60), r = m % 60;
  const u = UNITS[lang] || ['h', 'min'];
  const sp = (lang === 'zh' || lang === 'ja') ? '' : ' ';
  const a = [];
  if (h) a.push(h + sp + u[0]);
  if (r || !h) a.push(r + sp + u[1]);
  return a;
}
function clockDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
}
function contrast(hex) {
  const r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
  return ((r * 299 + g * 587 + b * 114) / 1000 >= 148) ? '#16181D' : '#FFFFFF';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ============================================================
   POHRANA
   Podaci vise ne zive u localStorageu. Idu u pravu bazu:
   na uredaju SQLite preko Capacitora, u pregledniku IndexedDB.
   localStorage ostaje samo kao zrcalna kopija i kao izvor iz
   kojeg se postojeci podaci jednom preseljavaju.
   ============================================================ */
const DB_NAME = 'my24', DB_STORE = 'kv', DB_TABLE = 'kv';

const Store = {
  mode: 'none',
  _idb: null,
  _sql: null,

  isNative() {
    const c = window.Capacitor;
    return !!(c && c.isNativePlatform && c.isNativePlatform() && c.Plugins && c.Plugins.CapacitorSQLite);
  },

  async open() {
    if (this.isNative()) {
      try { await this._openSqlite(); this.mode = 'sqlite'; return this.mode; }
      catch (e) { /* pada na IndexedDB */ }
    }
    try { await this._openIdb(); this.mode = 'idb'; }
    catch (e) { this.mode = 'none'; }
    return this.mode;
  },

  /* ---------- SQLite (uredaj) ---------- */
  async _openSqlite() {
    const p = window.Capacitor.Plugins.CapacitorSQLite;
    this._sql = p;
    await p.createConnection({ database: DB_NAME, encrypted: false, mode: 'no-encryption', version: 1 });
    await p.open({ database: DB_NAME });
    await p.execute({
      database: DB_NAME,
      statements: 'CREATE TABLE IF NOT EXISTS ' + DB_TABLE + ' (k TEXT PRIMARY KEY NOT NULL, v TEXT);'
    });
  },

  /* ---------- IndexedDB (preglednik) ---------- */
  _openIdb() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open(DB_NAME, 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      rq.onsuccess = () => { this._idb = rq.result; res(); };
      rq.onerror = () => rej(rq.error);
    });
  },
  _tx(mode) {
    return this._idb.transaction(DB_STORE, mode).objectStore(DB_STORE);
  },

  async get(k) {
    if (this.mode === 'sqlite') {
      const r = await this._sql.query({
        database: DB_NAME, statement: 'SELECT v FROM ' + DB_TABLE + ' WHERE k = ?;', values: [k]
      });
      const rows = r && r.values;
      return rows && rows.length ? rows[0].v : null;
    }
    if (this.mode === 'idb') {
      return new Promise((res, rej) => {
        const rq = this._tx('readonly').get(k);
        rq.onsuccess = () => res(rq.result == null ? null : rq.result);
        rq.onerror = () => rej(rq.error);
      });
    }
    return null;
  },

  async set(k, v) {
    if (this.mode === 'sqlite') {
      await this._sql.run({
        database: DB_NAME,
        statement: 'INSERT INTO ' + DB_TABLE + ' (k, v) VALUES (?, ?) ON CONFLICT(k) DO UPDATE SET v = excluded.v;',
        values: [k, v]
      });
      return;
    }
    if (this.mode === 'idb') {
      return new Promise((res, rej) => {
        const rq = this._tx('readwrite').put(v, k);
        rq.onsuccess = () => res();
        rq.onerror = () => rej(rq.error);
      });
    }
  }
};

const DATA_KEYS = ['kr_cats', 'kr_logs', 'kr_quicks'];
const PREF_KEYS = ['kr_lang', 'kr_zoom', 'kr_scale', 'kr_float'];

/* Jednokratno preseljenje zateceniih podataka iz localStoragea. */
async function migrateStore() {
  if (Store.mode === 'none') return;
  try {
    if (await Store.get('migrated')) return;
    for (const k of DATA_KEYS.concat(PREF_KEYS)) {
      const v = LS.get(k);
      if (v !== null && (await Store.get(k)) == null) await Store.set(k, v);
    }
    await Store.set('migrated', '1');
  } catch (e) { /* preseljenje nije kriticno */ }
}

/* Baza je izvor istine; localStorage je zrcalo za slucaj da baza zakaze. */
async function readKey(k) {
  let v = null;
  try { v = await Store.get(k); } catch (e) {}
  if (v == null) v = LS.get(k);
  return v;
}

let persistTimer = null;
function persist(payload) {
  for (const k in payload) LS.set(k, payload[k]);
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    for (const k in payload) { Store.set(k, payload[k]).catch(() => {}); }
  }, 120);
}

function exportPayload() {
  return JSON.stringify({
    app: 'my24', version: 1, exported: new Date().toISOString(),
    categories: cats.filter(c => c.name.trim()),
    logs: logs,
    quicks: quicks
  }, null, 2);
}

async function exportData() {
  const name = 'my24-' + ymd(new Date()) + '.json';
  const json = exportPayload();
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins.Filesystem) {
    try {
      await cap.Plugins.Filesystem.writeFile({ path: name, data: json, directory: 'CACHE', encoding: 'utf8' });
      const uri = await cap.Plugins.Filesystem.getUri({ path: name, directory: 'CACHE' });
      if (cap.Plugins.Share) await cap.Plugins.Share.share({ title: name, url: uri.uri });
      toast(t('exportBtn') + ' · ' + name);
      return;
    } catch (e) { /* pada na preuzimanje u pregledniku */ }
  }
  const a = document.createElement('a');
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(t('exportBtn') + ' · ' + name);
}

/* Uvoz spaja, ne brise: dodaju se samo zapisi kojih jos nema. */
function importJson(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { toast(t('importBad')); return; }
  if (!d || (!Array.isArray(d.logs) && !Array.isArray(d.categories))) { toast(t('importBad')); return; }
  snap();
  let nc = 0, nl = 0, nq = 0;
  (d.categories || []).forEach(c => {
    if (!c || !c.id || cats.some(x => x.id === c.id)) return;
    cats.push({ id: c.id, name: c.name || '', icon: c.icon || '', emoji: c.emoji || '',
                color: c.color || nextColor() });
    nc++;
  });
  (d.logs || []).forEach(l => {
    if (!l || !l.id || !l.startTime || logs.some(x => x.id === l.id)) return;
    logs.push({ id: l.id, title: l.title || '', catId: l.catId || '',
                startTime: l.startTime, endTime: l.endTime || '', note: l.note || '' });
    nl++;
  });
  (d.quicks || []).forEach(q => {
    if (!q || !q.id || quicks.some(x => x.id === q.id)) return;
    quicks.push({ id: q.id, name: q.name || '', catId: q.catId || '', emoji: q.emoji || '' });
    nq++;
  });
  sortLogs(); save();
  renderAll();
  if ($('sheet-manage').classList.contains('on')) renderManage();
  toast(t('imported') + ' · ' + nl + ' / ' + nc + ' / ' + nq, true);
}

function pickImport() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importJson(String(r.result));
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- podaci ---------- */
async function loadData() {
  const rawCats = await readKey('kr_cats');
  const rawLogs = await readKey('kr_logs');
  const rawQuicks = await readKey('kr_quicks');
  try {
    const c = JSON.parse(rawCats || '[]');
    cats = c.map((x, i) => ({
      id: x.id || 'c_' + i, name: x.name || '',
      icon: x.icon || '', emoji: x.emoji || '',
      color: x.color || PALETTE[i % PALETTE.length]
    }));
  } catch (e) { cats = []; }
  try { logs = JSON.parse(rawLogs || '[]'); } catch (e) { logs = []; }
  try { quicks = JSON.parse(rawQuicks || '[]'); } catch (e) { quicks = []; }
  logs = logs.filter(l => l && l.startTime);
  sortLogs();
}
function sortLogs() { logs.sort((a, b) => new Date(a.startTime) - new Date(b.startTime)); }
function save() {
  persist({
    kr_cats: JSON.stringify(cats.filter(c => c.name.trim())),
    kr_logs: JSON.stringify(logs),
    kr_quicks: JSON.stringify(quicks)
  });
}
const catOf = id => cats.find(c => c.id === id) ||
  { id: '', name: t('noCategory'), icon: 'none', emoji: '', color: '#9A9C97' };

/* Kako se unos zove u prikazu: vlastiti naslov, inace naziv kategorije,
   a ako ni nje nema - "Bez naziva". Nista nije obavezno. */
function logLabel(l) {
  if (l.title) return l.title;
  const c = cats.find(x => x.id === l.catId);
  return (c && c.name.trim()) ? c.name : t('untitled');
}
const liveCats = () => cats.filter(c => c.name.trim());

function nextStart(log) {
  const s = +new Date(log.startTime); let best = null;
  for (const l of logs) {
    if (l.id === log.id) continue;
    const ls = +new Date(l.startTime);
    if (ls > s && (best === null || ls < best)) best = ls;
  }
  return best;
}
/* Kraj otvorenog unosa: traje do sada, ili do pocetka iduceg unosa - sto god dode prije. */
function effEnd(log) {
  if (log.endTime) return new Date(log.endTime);
  const s = +new Date(log.startTime), n = nextStart(log), now = Date.now();
  let e = (now > s) ? now : s + 30 * 60000;
  if (n !== null) e = Math.min(e, n);
  if (e - s > DAY_MS) e = s + DAY_MS;
  return new Date(Math.max(e, s));
}

/* Aktivnost u tijeku = zadnji vec zapoceti unos koji nema kraj. */
/* Kraj zadnje aktivnosti koja je vec zavrsila prije zadanog trenutka.
   To je prirodno polaziste novog unosa: kad jedna aktivnost zavrsi, pocinje iduca. */
function prevEndBefore(ts, exceptId) {
  const og = ongoingLog();
  let best = null;
  for (const l of logs) {
    if (l.id === exceptId) continue;
    if (og && l.id === og.id) continue;
    const e = +effEnd(l);
    if (e <= ts && (best === null || e > best)) best = e;
  }
  return best;
}

function ongoingLog() {
  const now = Date.now();
  let best = null, bestS = -Infinity;
  for (const l of logs) {
    const s = +new Date(l.startTime);
    if (s > now) continue;
    if (s > bestS) { best = l; bestS = s; }
  }
  if (!best || best.endTime) return null;
  if (now - bestS > DAY_MS) return null;
  return best;
}

/* ---------- snimka za poništavanje ---------- */
function snap() { undoSnap = JSON.stringify({ logs: logs, cats: cats, quicks: quicks }); }
function undo() {
  if (!undoSnap) return;
  const d = JSON.parse(undoSnap);
  logs = d.logs; cats = d.cats; quicks = d.quicks;
  undoSnap = null;
  save(); renderAll();
  if ($('sheet-manage').classList.contains('on')) renderManage();
  hideToast();
}
function toast(msg, withUndo) {
  clearTimeout(toastTimer);
  $('toast-msg').textContent = msg;
  const b = $('toast-act');
  b.textContent = t('undo');
  b.classList.toggle('hide', !withUndo);
  $('toast').classList.add('on');
  toastTimer = setTimeout(hideToast, withUndo ? 4200 : 2200);
}
function hideToast() { $('toast').classList.remove('on'); }

ICON_PATHS.none = '<circle cx="12" cy="12" r="7.6" stroke-dasharray="2.6 2.6"/>';
const ICON_KEYS = Object.keys(ICON_PATHS).filter(k => k !== 'none');

/* Jedan crtez, u zadanoj velicini i boji. */
function iconSvg(name, size, color) {
  const p = ICON_PATHS[name];
  if (!p) return '';
  const s = size || 18;
  return '<svg class="ico" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" ' +
    'stroke="' + (color || 'currentColor') + '" stroke-width="1.7" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
}

/* Oznaka kategorije: crtez ako je odabran, inace emoji, inace monogram.
   Monogram rjesava ono sto ikone ne mogu - bilo kakav naziv na bilo kojem jeziku. */
function catMark(c, size, col) {
  const s = size || 18;
  const k = col || (c && c.color) || '#8B8D88';
  if (c && c.icon && ICON_PATHS[c.icon]) return iconSvg(c.icon, s, k);
  if (c && c.emoji) return '<span class="mk-emoji" style="font-size:' + s + 'px">' + c.emoji + '</span>';
  const ch = ((c && c.name ? c.name.trim() : '') || '?').charAt(0).toUpperCase();
  return '<span class="mk-mono" style="color:' + k +
    ';width:' + s + 'px;height:' + s + 'px;font-size:' + Math.round(s * 0.62) + 'px">' + esc(ch) + '</span>';
}

const W_ICON = {

function placeBubble() {
  const w = $('bub');
  if (!bubPos) bubPos = { x: window.innerWidth - 62, y: window.innerHeight * 0.42 };
  const cw = bubOpen ? 156 : 48;
  let x = bubPos.x;
  if (bubOpen) {
    /* Otvoreni gumb se pomakne prema sredini ekrana da ikone imaju mjesta. */
    x += (bubPos.x + 24 < window.innerWidth / 2) ? 54 : -54;
    x -= 54;
  }
  x = Math.max(8, Math.min(x, window.innerWidth - cw - 8));
  const y = Math.max(8, Math.min(bubPos.y, window.innerHeight - 62));
  w.style.left = Math.round(x) + 'px';
  w.style.top = Math.round(y) + 'px';
}

function renderBubble() {
  const w = $('bub');
  if (!bubOn) { w.className = 'bub-wrap hide'; w.innerHTML = ''; $('bub-drop').className = 'bub-drop'; return; }
  w.className = 'bub-wrap' + (bubOpen ? ' open' : '');
  w.innerHTML =
    '<div class="bub-row">' +
      '<button class="bub-side" data-w="start" aria-label="' + esc(t('mStart')) + '">' + W_ICON.start + '</button>' +
      '<button class="bub" aria-label="' + esc(t('add')) + '">' + W_ICON.plus + '</button>' +
      '<button class="bub-side" data-w="end" aria-label="' + esc(t('mEnd')) + '">' + W_ICON.stop + '</button>' +
    '</div>';
  $('bub-drop').innerHTML = W_ICON.x;
  placeBubble();

  w.querySelectorAll('.bub-side').forEach(b => b.onclick = e => {
    e.stopPropagation();
    bubOpen = false; renderBubble();
    wAct[b.dataset.w]();
  });

}

/* Povlacenje: kratak dodir otvara ili zatvara, povlacenje pomice,
   a spustanje na "X" pri dnu gasi lebdeci gumb. */
function bindBubbleDrag(handle) {
  const w = $('bub'), drop = $('bub-drop');
  let sx = 0, sy = 0, ox = 0, oy = 0, moved = false, hot = false;

  const near = (px, py) => {
    const r = drop.getBoundingClientRect();
    return Math.hypot(px - (r.left + r.width / 2), py - (r.top + r.height / 2)) < 78;
  };
  const move = e => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < 6) return;
    if (!moved) { moved = true; w.classList.add('drag'); drop.classList.add('on'); bubOpen = false; w.classList.remove('open'); }
    bubPos = { x: ox + dx, y: oy + dy };
    placeBubble();
    hot = near(e.clientX, e.clientY);
    drop.classList.toggle('hot', hot);
  };
  const up = e => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    w.classList.remove('drag');
    drop.className = 'bub-drop';
    if (!moved) { bubOpen = !bubOpen; renderBubble(); return; }
    if (hot) { setBubble(false); toast(t('floating') + ' \u00b7 ' + t('deleted')); }
  };
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    sx = e.clientX; sy = e.clientY;
    if (!bubPos) placeBubble();
    ox = bubPos.x; oy = bubPos.y;
    moved = false; hot = false;
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}

function renderDayStrip(keepLeft) {

  const base = new Date(); base.setHours(0, 0, 0, 0);

    setTimeout(() => selEl.scrollIntoView({ block: 'nearest', inline: 'center' }), 0);
  }
}

/* Ponedjeljak kao prvi dan tjedna. */
function weekStartOf(dStr) {
  const d = parseYmd(dStr);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}
function weekDays(dStr) {
  const w = weekStartOf(dStr), out = [];
  for (let i = 0; i < 7; i++) { const d = new Date(w); d.setDate(d.getDate() + i); out.push(ymd(d)); }
  return out;
}

/* Dani koji imaju barem jedan unos - jedan prolaz kroz zapise. */
function daysWithLogs() {
  const set = new Set();
  for (const l of logs) set.add(ymd(new Date(l.startTime)));
  return set;
}

function stepPeriod(dir) {
  const d = parseYmd(selDay);
  d.setDate(d.getDate() + dir * (tlScale === 'week' ? 7 : 1));
  selDay = ymd(d);
  ttDay = null;
