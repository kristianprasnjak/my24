/* ============================================================
   KRONOS — dizajn tokeni
   ============================================================ */
:root{
  --bg:#F1F1EE;
  --surface:#FBFBFA;
  --surface-2:#EBEBE7;
  --surface-3:#DFDFD9;
  --text:#101215;
  --text-2:#5A5D58;
  --text-3:#93958F;
  --line:#DEDED9;
  --line-2:#EAEAE5;
  /* U ovom smjeru naglasak je tinta, ne boja. Signalna crvena je rezervirana
     iskljucivo za trenutno vrijeme i za upozorenja. */
  --accent:#101215;
  --accent-2:#101215;
  --accent-soft:rgba(16,18,21,.07);
  --accent-text:#101215;
  --danger:#C4351E;
  --danger-soft:rgba(196,53,30,.09);
  /* Tipografija. Skala: 11 / 12 / 13 / 15 / 17 / 20 / 30.
     Debljine: 400 regular, 500 medium, 600 semibold, 700 bold, 800 extrabold.
     Polja za unos nikad ispod 16px - inace iOS zumira stranicu pri fokusu. */
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r-lg:4px;
  --r-md:3px;
  --r-sm:3px;
  --sh-1:none;
  --sh-2:0 -1px 0 var(--line), 0 -18px 44px rgba(12,14,18,.16);
  --sh-accent:none;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A0A0B;
    --surface:#141516;
    --surface-2:#1D1E20;
    --surface-3:#2A2B2D;
    --text:#EFEFEC;
    --text-2:#9A9C97;
    --text-3:#6C6E6A;
    --line:#282A2B;
    --line-2:#1E1F21;
    --accent:#EFEFEC;
    --accent-2:#EFEFEC;
    --accent-soft:rgba(239,239,236,.10);
    --accent-text:#EFEFEC;
    --danger:#E4553B;
    --danger-soft:rgba(228,85,59,.14);
    --sh-1:none;
    --sh-2:0 -1px 0 var(--line), 0 -18px 48px rgba(0,0,0,.6);
    --sh-accent:none;
  }
}

/* ============================================================
   my24 v2 — osnova
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;text-size-adjust:100%;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.bar{width:3px;height:18px;border-radius:2px;flex:none}
.ico{flex:none;display:block}
.mk-emoji{line-height:1;display:inline-block}
.mk-mono{display:inline-flex;align-items:center;justify-content:center;border:1.6px solid currentColor;border-radius:3px;font-weight:800;line-height:1;flex:none}
.hs{scrollbar-width:none}.hs::-webkit-scrollbar{display:none}

.app{
  height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding:calc(12px + var(--safe-t)) 16px calc(12px + var(--safe-b));
}

/* ---------- zaglavlje ---------- */
.hdr{display:flex;align-items:center;gap:10px;flex:none}
.brand-mark{width:30px;height:30px;border-radius:3px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.brand{flex:1;min-width:0;display:flex;flex-direction:column}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.015em}
.brand span{font-family:var(--font-num);font-size:12px;color:var(--text-2)}
.icon-btn{width:38px;height:38px;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn:active{transform:scale(.94)}

.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}

/* ---------- lanac ---------- */
.chain{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden;position:relative}
.chain::before{content:"";position:absolute;left:0;right:0;top:0;height:28px;background:linear-gradient(var(--bg),transparent);z-index:2;pointer-events:none}
.row{
  display:flex;align-items:center;gap:9px;height:40px;padding:0 10px;flex:none;width:100%;text-align:left;
  border-radius:3px;border:1px solid transparent;
}
.row:active{background:var(--surface-2)}
.row.sel{border:2px solid var(--text);background:var(--surface);padding:0 9px}
.row.old{opacity:.5;height:34px}
.row .nm{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-family:var(--font-num);font-size:12px;color:var(--text-2);white-space:nowrap}
.row .od{color:var(--text-2);flex:none}
.hole{
  display:flex;align-items:center;gap:9px;height:44px;padding:0 10px;flex:none;width:100%;text-align:left;
  border-radius:3px;border:1.5px dashed var(--danger);
}
.hole.tgt{border:2px solid var(--text);background:var(--surface)}
.hole.trail{height:54px;border-radius:4px;padding:0 12px}
.hole .q{width:22px;height:22px;flex:none;border-radius:3px;border:1.5px dashed var(--danger);color:var(--danger);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.hole.trail .q{width:26px;height:26px;font-size:15px}
.hole .rg{flex:1;font-family:var(--font-num);font-size:14px;font-weight:500}
.hole.trail .rg{font-size:16px}
.hole .du{font-family:var(--font-num);font-size:15px;font-weight:600;color:var(--danger)}
.hole.trail .du{font-size:20px}
@keyframes holePulse{0%{box-shadow:0 0 0 0 rgba(196,53,30,.55);background:rgba(196,53,30,.16)}100%{box-shadow:0 0 0 9px rgba(196,53,30,0);background:rgba(196,53,30,0)}}
.pulse{animation:holePulse .45s ease-out 2}

/* ---------- u tijeku ---------- */
.run{
  position:relative;overflow:hidden;flex:none;border-radius:var(--r-lg);color:#fff;
  padding:10px 10px 10px 12px;display:flex;align-items:center;gap:12px;background:var(--live-c);
}
.run::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22),rgba(255,255,255,0) 58%);pointer-events:none}
.run > *{position:relative;z-index:1}
.run-ico{width:38px;height:38px;flex:none;border-radius:3px;background:rgba(255,255,255,.20);display:flex;align-items:center;justify-content:center}
.run-body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:#fff}
.run-body b{font-size:17px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.run-body span{font-family:var(--font-num);font-size:13px;opacity:.85}
.run-stop{height:44px;padding:0 14px;border-radius:3px;background:rgba(255,255,255,.24);color:#fff;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;flex:none}
.run-stop:active{transform:scale(.95)}

/* ---------- zadnji unos ---------- */
@keyframes freshIn{from{background:#FFF3D6}to{background:var(--surface)}}
.fresh{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.fresh.anim{animation:freshIn 1.1s ease-out 1}
.fr-top{display:flex;align-items:center;gap:6px}
.tchip{height:36px;padding:0 9px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--font-num);font-size:14px;font-weight:600;flex:none}
.tchip.warn{border-color:var(--danger);color:var(--danger)}
.fr-dash{font-family:var(--font-num);color:var(--text-3);font-size:13px}
.fr-dur{flex:1;font-family:var(--font-num);font-size:12px;color:var(--text-2)}
.sq{width:36px;height:36px;border-radius:3px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;font-size:16px;color:var(--text-2)}
.sq.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.sq.has{border-color:var(--text);color:var(--text)}
.fixes{display:flex;gap:6px}
.fix{flex:1;height:38px;border-radius:3px;border:1.5px solid var(--danger);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:6px}
.fix b{font-family:var(--font-num);font-size:14px;font-weight:600}
.fix span{font-size:11px;font-weight:600;color:var(--text-2)}
.names{display:flex;gap:6px;overflow-x:auto}
.nchip{flex:none;height:36px;padding:0 12px;border-radius:3px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.nchip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.nchip.add{border-style:dashed;border-color:var(--text-3);background:transparent;color:var(--text-2)}
.ninp{flex:1 0 130px;height:36px;border-radius:3px;border:2px solid var(--text);background:var(--surface);padding:0 10px;font-size:16px;font-weight:600;outline:none}
.desc{width:100%;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);padding:8px 10px;font-size:16px;resize:none;outline:none}

/* ---------- prijedlog ---------- */
.hero{
  flex:none;height:58px;border-radius:3px;background:var(--text);color:var(--bg);
  display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left;
}
.hero:active{transform:scale(.98)}
.hero-v{width:32px;height:32px;flex:none;border-radius:3px;background:rgba(127,127,127,.28);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.hero-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hero-b b{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden}
.hero-b b span{overflow:hidden;text-overflow:ellipsis}
.hero-b small{font-size:11px;font-weight:600;letter-spacing:.02em;opacity:.6}
.hero-t{font-family:var(--font-num);font-size:14px;opacity:.8;white-space:nowrap}

/* ---------- segment, meta ---------- */
.seg{flex:none;display:grid;grid-template-columns:1fr 1fr;padding:3px;gap:3px;background:var(--surface-2);border-radius:var(--r-lg)}
.seg button{height:36px;border-radius:3px;color:var(--text-2);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.target{flex:none;display:flex;align-items:center;gap:10px;height:42px;padding:0 4px 0 10px;border:2px solid var(--text);border-radius:var(--r-lg);background:var(--surface)}
.target .q{width:22px;height:22px;border-radius:3px;border:1.5px dashed var(--danger);color:var(--danger);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.target .rg{flex:1;font-family:var(--font-num);font-size:14px;font-weight:600}
.target .du{font-family:var(--font-num);font-size:14px;font-weight:600;color:var(--danger)}

.tiles{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{

.tile.ghost{border-style:dashed;border-color:var(--text-3);background:transparent;color:var(--text-2)}

.tile.sugg.on{border-style:solid;border-color:var(--text);background:var(--surface)}
.empty-hint{font-size:13px;color:var(--text-2);text-align:center;padding:6px 0 2px}

/* ---------- tabovi ---------- */
.tabs{flex:none}

/* ---------- kalendar ---------- */
.kal-nav{flex:none;display:flex;align-items:center;gap:6px}
.kal-date{position:relative;flex:1;height:40px;border-radius:3px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px}

.kal-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
.kal-list .row{height:44px;border-bottom:1px solid var(--line-2);border-radius:0}
.kal-list .hole{height:40px;margin:2px 0}
.kal-foot{flex:none;display:flex;justify-content:space-between;align-items:center;height:40px;padding:0 12px;border-radius:3px;border:1px solid var(--line);color:var(--text-2);font-size:13px;font-weight:600}
.kal-empty{color:var(--text-2);font-size:14px;text-align:center;padding:40px 0}

/* ---------- listovi (sheets) ---------- */
.scrim{position:fixed;inset:0;z-index:200;background:rgba(8,10,16,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:201;max-width:520px;margin:0 auto;max-height:92%;

.sh-bd{flex:1;overflow-y:auto;padding:0 20px 12px;display:flex;flex-direction:column;gap:12px}
.sh-ft{flex:none;padding:10px 20px 14px;border-top:1px solid var(--line-2);display:flex;gap:8px}

.btn-main:active{transform:scale(.98)}

.inp:focus{border-color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{height:54px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.tbtn span{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--text-2)}

.pills{display:flex;flex-wrap:wrap;gap:6px}

.pill.on{border:2px solid var(--text);padding:0 10px 0 8px}

/* ---------- kotačić ---------- */
.wheel{position:relative;height:168px;display:flex}
.wheel::before{content:"";position:absolute;left:0;right:0;top:56px;height:56px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);pointer-events:none}
.wcol{flex:1;height:168px;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.wcol::-webkit-scrollbar{display:none}

.wanch b{font-family:var(--font-num);font-size:14px;font-weight:600}
.wanch span{font-size:10px;font-weight:600;color:var(--text-2)}

/* ---------- kategorije ---------- */
.crow{display:flex;align-items:center;gap:8px}
.crow .mk{width:44px;height:44px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.crow .inp{flex:1}
.crow .cl{width:44px;height:44px;border-radius:3px;flex:none}

.grid-cl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.sugg-row{display:flex;flex-wrap:wrap;gap:6px}
.q-box{width:26px;height:26px;flex:none;border-radius:3px;border:1.5px dashed var(--danger);color:var(--danger);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.data-row{display:flex;gap:8px}

.an-row{display:flex;align-items:center;gap:10px;height:40px}
.an-row .nm{flex:1;font-weight:600;font-size:14px}
.an-row .v{font-family:var(--font-num);font-size:13px;color:var(--text-2)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-b));z-index:400;transform:translate(-50%,24px);opacity:0;pointer-events:none;
  width:calc(100% - 32px);max-width:420px;background:var(--text);color:var(--bg);border-radius:3px;
  padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;
  transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .2s;
}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast .msg{flex:1}
.toast button{color:var(--bg);font-weight:800;text-decoration:underline;text-underline-offset:3px}
</style>
</head>

<script>
/* ============================================================
   my24 v2
   Jedan tok: dodir na kategoriju upisuje je na očito mjesto.
   - rupa je meta  -> popunjava rupu
   - nešto traje   -> završava ga sad i počinje novo
   - prazno do sad -> ■ od kraja zadnjeg do sad, ili ▶ od sad

   Prijedlozi su obična pravila nad poviješću (jučer, prije 7 i 14 dana). Bez AI-a.

const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const TRAIL_MIN = 2;           // od koliko minuta se prazno do sad prikazuje kao rupa
const STALE = 18 * 3600000;    // stariji kraj/početak od ovoga više nije "sad" (dugo nekorišteno)

};

const p2 = n => String(n).padStart(2, '0');

const floorMin = ms => Math.floor(ms / MIN) * MIN;
const nowMs = () => floorMin(Date.now());
function dur(ms) {
  const m = Math.max(0, Math.round(ms / MIN)), h = Math.floor(m / 60), r = m % 60;
  return h ? h + ':' + p2(r) : r + ' min';
}
function durLong(ms) {
  const m = Math.max(0, Math.round(ms / MIN)), h = Math.floor(m / 60), r = m % 60;
  return h ? h + ' h ' + p2(r) + ' min' : r + ' min';
}
function clock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' : '') + p2(m) + ':' + p2(x);
}
const ymd = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayStart = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return +d; };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const DAYS = ['Nedjelja', 'Ponedjeljak', 'Utorak', 'Srijeda', 'Četvrtak', 'Petak', 'Subota'];
const DAYS_S = ['ned', 'pon', 'uto', 'sri', 'čet', 'pet', 'sub'];

/* ---------- ikone kategorija (iste kao u v1) ---------- */
const ICON_PATHS = {

  learn:  '<path d="M4 5.2A2 2 0 0 1 6 3.2h13.5v17.6H6a2 2 0 0 1-2-2z"/><path d="M8.2 3.2v17.6"/>',
  car:    '<path d="M4.5 16.5v-3l2-5.2A1.6 1.6 0 0 1 8 7.2h8a1.6 1.6 0 0 1 1.5 1.1l2 5.2v3z"/><path d="M4.5 16.5h15M7 16.5v2M17 16.5v2M7.5 12.8h9"/>',

  shop:   '<path d="M4 6h16l-1.4 13.4a1.5 1.5 0 0 1-1.5 1.35H6.9a1.5 1.5 0 0 1-1.5-1.35z"/><path d="M8.5 9V5.6a3.5 3.5 0 0 1 7 0V9"/>',

};
const ICON_KEYS = Object.keys(ICON_PATHS);
function iconSvg(name, size, color) {
  const p = ICON_PATHS[name];
  if (!p) return '';
  return '<svg class="ico" viewBox="0 0 24 24" width="' + (size || 18) + '" height="' + (size || 18) + '" fill="none" stroke="' +
    (color || 'currentColor') + '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
}
/* Oznaka kategorije u crno-bijelom: crtež, emoji ili prvo slovo. */
function catMark(c, size, col) {
  const s = size || 18, k = col || 'currentColor';
  if (c && c.icon && ICON_PATHS[c.icon]) return iconSvg(c.icon, s, k);
  if (c && c.emoji) return '<span class="mk-emoji" style="font-size:' + (s - 2) + 'px">' + c.emoji + '</span>';
  const ch = ((c && c.name ? c.name.trim() : '') || '?').charAt(0).toUpperCase();
  return '<span class="mk-mono" style="width:' + s + 'px;height:' + s + 'px;font-size:' + Math.round(s * 0.6) + 'px;color:' + k + '">' + esc(ch) + '</span>';

  ['Trening', 'gym', '#8A3A2C'], ['Odmor', 'rest', '#41604C'], ['Učenje', 'learn', '#7A6524'],

                 '#7A6524', '#6B563E', '#6A3F63', '#3E6B63', '#56507E', '#9A5A3C', '#3E4147'];

/* ============================================================
   POHRANA — ista kao u v1 (SQLite na uređaju, IndexedDB u pregledniku)
   ============================================================ */
const DB_NAME = 'my24', DB_STORE = 'kv', DB_TABLE = 'kv';
const Store = {
  mode: 'none', _idb: null, _sql: null,
  isNative() {
    const c = window.Capacitor;
    return !!(c && c.isNativePlatform && c.isNativePlatform() && c.Plugins && c.Plugins.CapacitorSQLite);
  },
  async open() {
    if (this.isNative()) {
      try { await this._openSqlite(); this.mode = 'sqlite'; return this.mode; } catch (e) {}
    }
    try { await this._openIdb(); this.mode = 'idb'; } catch (e) { this.mode = 'none'; }
    return this.mode;
  },
  async _openSqlite() {
    const p = window.Capacitor.Plugins.CapacitorSQLite;
    this._sql = p;
    await p.createConnection({ database: DB_NAME, encrypted: false, mode: 'no-encryption', version: 1 });
    await p.open({ database: DB_NAME });
    await p.execute({ database: DB_NAME, statements: 'CREATE TABLE IF NOT EXISTS ' + DB_TABLE + ' (k TEXT PRIMARY KEY NOT NULL, v TEXT);' });
  },
  _openIdb() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open(DB_NAME, 1);
      rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
      rq.onsuccess = () => { this._idb = rq.result; res(); };
      rq.onerror = () => rej(rq.error);
    });
  },
  _tx(mode) { return this._idb.transaction(DB_STORE, mode).objectStore(DB_STORE); },
  async get(k) {
    if (this.mode === 'sqlite') {
      const r = await this._sql.query({ database: DB_NAME, statement: 'SELECT v FROM ' + DB_TABLE + ' WHERE k = ?;', values: [k] });
      const rows = r && r.values;
      return rows && rows.length ? rows[0].v : null;
    }
    if (this.mode === 'idb') {
      return new Promise((res, rej) => {
        const rq = this._tx('readonly').get(k);
        rq.onsuccess = () => res(rq.result == null ? null : rq.result);
        rq.onerror = () => rej(rq.error);
      });
    }
    return null;
  },
  async set(k, v) {
    if (this.mode === 'sqlite') {
      await this._sql.run({ database: DB_NAME, statement: 'INSERT INTO ' + DB_TABLE + ' (k, v) VALUES (?, ?) ON CONFLICT(k) DO UPDATE SET v = excluded.v;', values: [k, v] });
      return;
    }
    if (this.mode === 'idb') {
      return new Promise((res, rej) => {
        const rq = this._tx('readwrite').put(v, k);
        rq.onsuccess = () => res();
        rq.onerror = () => rej(rq.error);
      });
    }
  }
};
async function migrateStore() {
  if (Store.mode === 'none') return;
  try {
    if (await Store.get('migrated')) return;
    for (const k of ['kr_cats', 'kr_logs', 'kr_quicks', 'kr_lang']) {
      const v = LS.get(k);
      if (v !== null && (await Store.get(k)) == null) await Store.set(k, v);
    }
    await Store.set('migrated', '1');
  } catch (e) {}
}
async function readKey(k) {
  let v = null;
  try { v = await Store.get(k); } catch (e) {}
  if (v == null) v = LS.get(k);
  return v;
}
let persistTimer = null;
function persist(payload) {
  for (const k in payload) LS.set(k, payload[k]);
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => { for (const k in payload) Store.set(k, payload[k]).catch(() => {}); }, 120);
}

/* ============================================================
   PODACI
   Unos u pohrani: { id, title, catId, startTime, endTime, note } (ISO).
   U radu: { id, title, catId, s, e, note }  (ms; e = null dok traje).
   Brze radnje (kr_quicks) se ne prikazuju, ali se čuvaju netaknute.
   ============================================================ */
let cats = [], logs = [], quicksRaw = '[]';

async function loadData() {
  const rc = await readKey('kr_cats'), rl = await readKey('kr_logs');
  quicksRaw = (await readKey('kr_quicks')) || '[]';
  try {
    cats = JSON.parse(rc || '[]').map((x, i) => ({ id: x.id || 'c_' + i, name: x.name || '', icon: x.icon || '', emoji: x.emoji || '', color: x.color || PALETTE[i % PALETTE.length] }));
  } catch (e) { cats = []; }
  try {
    logs = JSON.parse(rl || '[]').filter(l => l && l.startTime).map(l => ({
      id: l.id || uid(), title: l.title || '', catId: l.catId || '', note: l.note || '',
      s: floorMin(+new Date(l.startTime)), e: l.endTime ? floorMin(+new Date(l.endTime)) : null
    }));
  } catch (e) { logs = []; }
  normalize();
}
function save() {
  persist({
    kr_cats: JSON.stringify(cats.filter(c => c.name.trim())),
    kr_logs: JSON.stringify(logs.map(l => ({ id: l.id, title: l.title, catId: l.catId,
      startTime: new Date(l.s).toISOString(), endTime: l.e === null ? '' : new Date(l.e).toISOString(), note: l.note }))),
    kr_quicks: quicksRaw
  });
}
/* Red po početku; samo zadnji unos smije biti otvoren; ništa se ne preklapa. */
function normalize() {
  logs.sort((a, b) => a.s - b.s);
  for (let i = 0; i < logs.length; i++) {
    const l = logs[i], n = logs[i + 1];
    if (n && (l.e === null || l.e > n.s)) l.e = Math.max(l.s, n.s);
  }
  logs = logs.filter(l => l.e === null || l.e > l.s);
  const last = logs[logs.length - 1];
  if (last && last.e === null && Date.now() - last.s > STALE) {
    const td = typicalDur(last);
    last.e = last.s + Math.min(td || HOUR, 16 * HOUR);
  }
}
const catOf = id => cats.find(c => c.id === id) || { id: '', name: 'Bez kategorije', icon: '', emoji: '', color: '#93958F' };
const liveCats = () => cats.filter(c => c.name.trim());
const label = l => { const c = catOf(l.catId); return l.title ? c.name + ' · ' + l.title : c.name; };
const endOf = l => l.e === null ? nowMs() : l.e;
const running = () => { const l = logs[logs.length - 1]; return l && l.e === null ? l : null; };
const lastLog = () => logs[logs.length - 1] || null;

/* ---------- poništavanje ---------- */
let undoStack = [];
function snap() {
  undoStack.push(JSON.stringify({ logs, cats, fresh: ui.fresh, target: ui.target }));
  if (undoStack.length > 40) undoStack.shift();
}
function undo() {
  const s = undoStack.pop();
  if (!s) return;
  const d = JSON.parse(s);
  logs = d.logs; cats = d.cats; ui.fresh = d.fresh; ui.target = d.target;
  ui.nameEdit = false; ui.descEdit = false;
  save(); renderAll();
}

/* ============================================================
   RUPE
   ============================================================ */
/* Rupe između završenih unosa (barem minuta). */
function innerHoles() {
  const out = [];
  for (let i = 1; i < logs.length; i++) {
    const a = logs[i - 1].e, b = logs[i].s;
    if (a !== null && b - a >= MIN) out.push({ a, b, i });
  }
  return out;
}
function trailingGap() {
  const l = lastLog();
  if (!l || l.e === null) return null;
  const n = nowMs();
  return (n - l.e >= TRAIL_MIN * MIN && n - l.e <= STALE) ? { a: l.e, b: n } : null;
}
const sameHole = (h, t) => h && t && h.a === t.a && h.b === t.b;
function validTarget() {
  if (!ui.target) return null;
  const h = innerHoles().find(x => sameHole(x, ui.target));
  if (!h) ui.target = null;
  return h || null;
}

/* ============================================================
   PRIJEDLOZI — pravila nad poviješću (bez AI-a)
   ============================================================ */
const BACK = [[1, 'jučer'], [7, 'prošli tj.'], [14, 'prije 2 tj.']];
function why(daysHit) {
  const names = BACK.filter(b => daysHit.has(b[0])).map(b => b[1]);
  if (!names.length) return '';
  return names.length === 1 ? 'kao ' + names[0] : 'kao ' + names.slice(0, 2).join(' i ');
}
/* Što je obično bilo u ovom rasponu (jučer, prije 7 i 14 dana). */
function guessFor(a, b) {
  const score = {}, hits = {}, titles = {};
  BACK.forEach(([d]) => {
    const A = a - d * DAY, B = b - d * DAY;
    logs.forEach(l => {
      const ov = Math.min(endOf(l), B) - Math.max(l.s, A);
      if (ov <= 0 || !l.catId) return;
      score[l.catId] = (score[l.catId] || 0) + ov;
      (hits[l.catId] = hits[l.catId] || new Set()).add(d);
      const tk = l.catId + '|' + l.title;
      titles[tk] = (titles[tk] || 0) + ov;
    });
  });
  let best = null;
  for (const k in score) if (catOf(k).name && (!best || score[k] > score[best])) best = k;
  if (!best || score[best] < (b - a) * 0.25) return null;
  let title = '', tb = 0;
  for (const k in titles) { const [c, t] = k.split('|'); if (c === best && t && titles[k] > tb) { tb = titles[k]; title = t; } }
  return { catId: best, title, why: why(hits[best]) };
}
/* Što obično počinje oko ovog trenutka, inače što obično slijedi. */
function guessStart(n, exclude) {
  const cnt = {}, hits = {};
  BACK.forEach(([d]) => {
    logs.forEach(l => {
      if (!l.catId || l.catId === exclude) return;
      if (Math.abs(l.s - (n - d * DAY)) <= 45 * MIN) {
        cnt[l.catId] = (cnt[l.catId] || 0) + 1;
        (hits[l.catId] = hits[l.catId] || new Set()).add(d);
      }
    });
  });
  let best = null;
  for (const k in cnt) if (catOf(k).name && (!best || cnt[k] > cnt[best])) best = k;
  if (best) return { catId: best, title: '', why: why(hits[best]) };
  const last = lastLog();
  if (last) {
    const nx = {};
    for (let i = 1; i < logs.length; i++) {
      if (logs[i - 1].catId === last.catId && logs[i].s > n - 30 * DAY && logs[i].catId && logs[i].catId !== exclude)
        nx[logs[i].catId] = (nx[logs[i].catId] || 0) + 1;
    }
    let bn = null;
    for (const k in nx) if (catOf(k).name && (!bn || nx[k] > nx[bn])) bn = k;
    if (bn) return { catId: bn, title: '', why: 'obično sljedeće' };
  }
  return null;
}
/* Nazivi koji su se već koristili s kategorijom, po učestalosti (zadnjih 60 dana). */
function namesFor(catId) {
  const cnt = {}, lim = nowMs() - 60 * DAY;
  logs.forEach(l => { if (l.catId === catId && l.title && l.s > lim) cnt[l.title] = (cnt[l.title] || 0) + 1; });
  return Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x]).slice(0, 3);
}
/* Uobičajeno trajanje iste stvari (medijan, barem 3 primjera). */
function typicalDur(l) {
  const ds = logs.filter(x => x !== l && x.e !== null && x.catId === l.catId && x.title === l.title && x.s > l.s - 30 * DAY)
                 .map(x => x.e - x.s).sort((a, b) => a - b);
  return ds.length >= 3 ? ds[Math.floor(ds.length / 2)] : null;
}
/* Kad je ista stvar inače završavala, za ponudu ispravka. */
function usualEnds(l) {
  const out = [];
  [[1, 'jučer'], [7, 'prošli tj.']].forEach(([d, lb]) => {
    const m = logs.find(x => x !== l && x.e !== null && x.catId === l.catId && x.title === l.title && Math.abs(x.s - (l.s - d * DAY)) <= 90 * MIN);
    if (m) {
      const t = floorMin(l.s + (m.e - m.s)), same = out.find(o => o.t === t);
      if (t > l.s && t < endOf(l)) { if (same) same.l += ' · ' + lb; else out.push({ t, l: lb }); }
    }
  });
  const td = typicalDur(l);
  if (!out.length && td) out.push({ t: l.s + td, l: 'obično' });
  return out;
}
const isSleep = c => c && c.icon === 'sleep';

/* ============================================================
   UI STANJE
   ============================================================ */
const ui = {
  tab: 'today', fresh: null, target: null, mode: null, nameEdit: false, descEdit: false,
  kalDay: ymd(new Date()), seenHoles: new Set(), freshAnim: false
};

/* ============================================================
   AKCIJE
   ============================================================ */
/* Jedan dodir na kategoriju: upiši je na očito mjesto. */
function pick(catId, title, forced) {
  snap();
  const n = nowMs(), run = running(), trail = trailingGap(), tgt = validTarget();
  const rec = { id: uid(), catId, title: title || '', note: '' };
  let openWheelSeq = null;
  if (tgt) {
    Object.assign(rec, { s: tgt.a, e: tgt.b });
    ui.target = null;
  } else if (run) {
    if (n - run.s < MIN) logs.splice(logs.indexOf(run), 1);   // greškom pokrenuto u istoj minuti
    else run.e = n;
    Object.assign(rec, { s: n, e: null });
  } else if (trail) {
    const m = forced || ui.mode || 'end';
    if (m === 'end') {
      Object.assign(rec, { s: trail.a, e: n });
      if (isSleep(catOf(catId)) && n - trail.a >= 3 * HOUR) openWheelSeq = ['e', 's'];
    } else {
      Object.assign(rec, { s: n, e: null });
      ui.target = { a: trail.a, b: n };
    }
  } else {
    Object.assign(rec, { s: n, e: null });
  }
  logs.push(rec);
  normalize();
  ui.fresh = rec.id; ui.mode = null; ui.nameEdit = false; ui.descEdit = false; ui.freshAnim = true;
  save(); renderAll();
  if (openWheelSeq) openWheel(rec.id, openWheelSeq[0], openWheelSeq.slice(1), true);
}
function stopRunning() {
  const r = running(); if (!r) return;
  snap();
  r.e = Math.max(r.s + MIN, nowMs());
  ui.fresh = r.id; ui.nameEdit = false; ui.descEdit = false; ui.freshAnim = true; ui.mode = null;
  save(); renderAll();
}
/* Postavi vrijeme unosa; ne smije prijeći susjede ni sadašnjost. */
function setTime(id, field, ms) {
  const i = logs.findIndex(l => l.id === id); if (i < 0) return;
  const l = logs[i], prev = logs[i - 1], next = logs[i + 1], n = nowMs();
  if (field === 's') {
    const lo = prev ? (prev.e === null ? prev.s + MIN : prev.e) : -Infinity;
    const hi = (l.e === null ? n : l.e) - MIN;
    l.s = Math.max(lo, Math.min(hi, ms));
  } else {
    const hi = next ? next.s : n;
    l.e = Math.max(l.s + MIN, Math.min(hi, ms));
  }
  // nova rupa uz ovaj unos postaje meta
  const h = innerHoles().find(x => x.i === i || x.i === i + 1);
  ui.target = h ? { a: h.a, b: h.b } : null;
  ui.fresh = id;
}
function updFresh(p) {
  const l = logs.find(x => x.id === ui.fresh); if (!l) return;
  Object.assign(l, p); save();
}

/* ============================================================
   RENDER — DANAS
   ============================================================ */
function renderSub() {
  const n = nowMs(), a = dayStart(n);
  let cov = 0;
  logs.forEach(l => { const ov = Math.min(endOf(l), n) - Math.max(l.s, a); if (ov > 0) cov += ov; });
  $('sub').textContent = DAYS_S[new Date(n).getDay()] + ' ' + new Date(n).getDate() + '.' + (new Date(n).getMonth() + 1) + '. · ' +
    Math.floor(cov / HOUR) + ' h ' + p2(Math.floor(cov % HOUR / MIN)) + ' min';
}

function holeHtml(h, cls, key) {
  const pulse = !ui.seenHoles.has(key) ? ' pulse' : '';
  return '<button class="hole ' + cls + pulse + '" data-hole="' + h.a + ',' + h.b + '">' +
    '<span class="q">?</span><span class="rg">' + hm(h.a) + '–' + hm(h.b) + '</span><span class="du">' + dur(h.b - h.a) + '</span></button>';
}
function rowHtml(l, sel, old) {
  const c = catOf(l.catId);
  return '<button class="row' + (sel ? ' sel' : '') + (old && !sel ? ' old' : '') + '" data-id="' + l.id + '">' +
    '<i class="bar" style="background:' + c.color + '"></i>' + catMark(c, 17) +
    '<span class="nm">' + esc(label(l)) + '</span>' + (l.note ? SVG_PEN_S : '') +
    '<span class="tm">' + hm(l.s) + '–' + (l.e === null ? '…' : hm(l.e)) + '</span></button>';
}

function renderChain() {
  const host = $('chain'), run = running(), trail = trailingGap(), tgt = validTarget();
  const n = nowMs();
  const ended = run ? logs.slice(0, -1) : logs;
  let start = Math.max(0, ended.length - CHAIN_MAX);
  while (start < ended.length && ended[start].e < n - CHAIN_WIN) start++;
  const recent = 0;
  const seen = new Set();
  let h = '';
  for (let i = start; i < logs.length; i++) {
    const l = logs[i], prev = logs[i - 1];
    if (i > start && prev && prev.e !== null && l.s - prev.e >= MIN) {
      const hole = { a: prev.e, b: l.s }, key = 'i' + hole.a + '-' + hole.b;
      h += holeHtml(hole, sameHole(hole, tgt) ? 'tgt' : '', key); seen.add(key);
    }
    if (l.e !== null) h += rowHtml(l, ui.fresh === l.id, i < recent);
  }
  if (trail) { const key = 't' + trail.a; h += holeHtml(trail, 'trail', key); seen.add(key); }

  if (run) {
    const c = catOf(run.catId);
    h += '<div class="run" style="--live-c:' + c.color + '">' +
      '<span class="run-ico">' + catMark(c, 19, '#fff') + '</span>' +
      '<button class="run-body" id="run-body"><b>' + esc(label(run)) + '</b><span id="run-time">' + hm(run.s) + ' · ' + clock(Date.now() - run.s) + '</span></button>' +
      '<button class="run-stop" id="run-stop">' + SVG_STOP + 'Završi</button></div>';
  }

  const F = logs.find(l => l.id === ui.fresh);
  if (F) h += freshHtml(F);
  if (!logs.length) h += '<div class="empty-hint">' + (liveCats().length ? 'Dodirni kategoriju kad nešto počne.' : 'Odaberi kategorije koje čine tvoj dan.') + '</div>';
  host.innerHTML = h;
  ui.seenHoles = seen;
  ui.freshAnim = false;

  host.querySelectorAll('.row').forEach(b => b.onclick = () => {
    ui.fresh = ui.fresh === b.dataset.id ? null : b.dataset.id; ui.nameEdit = false; ui.descEdit = false; renderToday();
  });
  host.querySelectorAll('.hole').forEach(b => b.onclick = () => {
    if (b.classList.contains('trail')) return;
    const [a, bb] = b.dataset.hole.split(',').map(Number);
    ui.target = sameHole({ a, b: bb }, ui.target) ? null : { a, b: bb };
    renderToday();
  });
  if (run) {
    $('run-stop').onclick = stopRunning;
    $('run-body').onclick = () => { ui.fresh = ui.fresh === run.id ? null : run.id; ui.nameEdit = false; ui.descEdit = false; renderToday(); };
  }
  if (F) bindFresh(F);
}

function freshHtml(F) {
  const c = catOf(F.catId), i = logs.indexOf(F), prev = logs[i - 1];
  const holeBefore = prev && prev.e !== null && F.s - prev.e >= MIN && F.s - prev.e <= STALE;
  const fixes = [];
  if (F.e !== null) {
    const td = typicalDur(F), d = F.e - F.s;
    if (td && d > td * 2 && d - td > 30 * MIN) usualEnds(F).forEach(u => fixes.push(u));
  }
  const names = namesFor(F.catId);
  if (F.title && names.indexOf(F.title) < 0) names.unshift(F.title);
  let h = '<div class="fresh' + (ui.freshAnim ? ' anim' : '') + '" id="fresh">' +
    '<div class="fr-top"><i class="bar" style="background:' + c.color + ';height:20px"></i>' +
    '<button class="tchip' + (holeBefore ? ' warn' : '') + '" id="f-s">' + hm(F.s) + '</button><span class="fr-dash">–</span>' +
    '<button class="tchip' + (fixes.length ? ' warn' : '') + '" id="f-e">' + (F.e === null ? '…' : hm(F.e)) + '</button>' +
    '<span class="fr-dur">' + dur(endOf(F) - F.s) + '</span>' +
    '<button class="sq' + (ui.descEdit ? ' on' : (F.note ? ' has' : '')) + '" id="f-desc" aria-label="Opis">' + SVG_PEN + '</button>' +

const IH = 56;
let W = null;   // { id, field, queue, v, sleep }
function buildWheel() {
  const mk = (n, id) => { let h = '<div class="pad"></div>'; for (let i = 0; i < n; i++) h += '<div class="it" data-i="' + i + '">' + p2(i) + '</div>'; $(id).innerHTML = h + '<div class="pad"></div>'; };
  mk(24, 'w-h'); mk(60, 'w-m');
  const onScroll = (col, n) => {
    let raf = null;
    col.addEventListener('scroll', () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        const i = Math.max(0, Math.min(n - 1, Math.round(col.scrollTop / IH)));
        paintCol(col, i);
        if (W && !W.sync) { const d = new Date(W.v); if (n === 24) d.setHours(i); else d.setMinutes(i); W.v = +d; $('w-val').textContent = hm(W.v); }
      });
    }, { passive: true });
  };
  onScroll($('w-h'), 24); onScroll($('w-m'), 60);
}
function paintCol(col, i) {
  col.querySelectorAll('.it').forEach(e => { const k = Math.abs(+e.dataset.i - i); e.className = 'it' + (k === 0 ? ' on' : k === 1 ? ' n1' : ''); });
}
function syncWheel() {
  if (!W) return;
  W.sync = true;
  const d = new Date(W.v), h = $('w-h'), m = $('w-m');
  h.scrollTop = d.getHours() * IH; m.scrollTop = d.getMinutes() * IH;
  paintCol(h, d.getHours()); paintCol(m, d.getMinutes());
  $('w-val').textContent = hm(W.v);
  setTimeout(() => { if (W) W.sync = false; }, 220);
}
function openWheel(id, field, queue, sleep) {
  const l = logs.find(x => x.id === id); if (!l) return;
  const c = catOf(l.catId), i = logs.indexOf(l), prev = logs[i - 1], n = nowMs();
  W = { id, field, queue: queue || [], v: field === 's' ? l.s : endOf(l), sleep: !!(sleep || isSleep(c)) };
  $('w-bar').style.background = c.color;
  $('w-title').textContent = label(l);
  $('w-lbl').textContent = W.sleep ? (field === 's' ? '☾ ZASPAO' : '☀ PROBUDIO') : (field === 's' ? 'OD' : 'DO');
  const an = [];
  if (field === 's') {
    if (prev && prev.e !== null) an.push({ t: prev.e, l: 'kraj ' + label(prev) });
    BACK.slice(0, 2).forEach(([d, lb]) => {
      const ref = l.s - d * DAY;
      const m = logs.filter(x => x !== l && x.catId === l.catId && Math.abs(x.s - ref) <= 3 * HOUR)
                    .sort((x, y) => Math.abs(x.s - ref) - Math.abs(y.s - ref))[0];
      if (m) { const t = m.s + d * DAY; if (t < endOf(l) && (!prev || prev.e === null || t >= prev.e) && !an.some(a => a.t === t)) an.push({ t, l: lb }); }
    });
  } else {
    BACK.slice(0, 2).forEach(([d, lb]) => {
      const ref = endOf(l) - d * DAY;
      const m = logs.filter(x => x !== l && x.e !== null && x.catId === l.catId && Math.abs(x.e - ref) <= 3 * HOUR)
                    .sort((x, y) => Math.abs(x.e - ref) - Math.abs(y.e - ref))[0];
      if (m) { const t = m.e + d * DAY; if (t > l.s && t < n && !an.some(a => a.t === t)) an.push({ t: floorMin(t), l: lb }); }
    });
    an.push({ t: n, l: 'sad' });
  }
  $('w-anch').innerHTML = an.slice(0, 3).map(a => '<button data-t="' + a.t + '"><b>' + hm(a.t) + '</b><span>' + esc(a.l) + '</span></button>').join('');
  $('w-anch').querySelectorAll('button').forEach(b => b.onclick = () => { W.v = +b.dataset.t; syncWheel(); });
  openSheet('sh-wheel');
  requestAnimationFrame(syncWheel);
}
/* Odabrani sat/minuta -> stvarni trenutak: početak je zadnji takav trenutak prije kraja,
   kraj je prvi takav trenutak nakon početka. */
function resolveWheel() {
  const l = logs.find(x => x.id === W.id); if (!l) return null;
  const d = new Date(W.v), H = d.getHours(), M = d.getMinutes();
  if (W.field === 's') {
    const ref = endOf(l), c = new Date(ref); c.setHours(H, M, 0, 0);
    let t = +c; if (t >= ref) t -= DAY;
    return t;
  }
  const c = new Date(l.s); c.setHours(H, M, 0, 0);
  let t = +c; if (t <= l.s) t += DAY;
  return t;
}
$('w-ok').onclick = () => {
  if (!W) return;
  const t = resolveWheel(), w = W;
  if (t !== null) { snap(); setTime(w.id, w.field, t); save(); }
  closeSheet('sh-wheel');
  renderAll();
  if (w.queue.length) setTimeout(() => openWheel(w.id, w.queue[0], w.queue.slice(1), w.sleep), 280);
};

  $('c-body').querySelectorAll('[data-mk]').forEach(b => b.onclick = () => { catOpen = (catOpen && catOpen.id === b.dataset.mk && catOpen.what === 'icon') ? null : { id: b.dataset.mk, what: 'icon' }; renderCatList(); });
  $('c-body').querySelectorAll('[data-cl]').forEach(b => b.onclick = () => { catOpen = (catOpen && catOpen.id === b.dataset.cl && catOpen.what === 'color') ? null : { id: b.dataset.cl, what: 'color' }; renderCatList(); });
  $('c-body').querySelectorAll('[data-pi]').forEach(b => b.onclick = () => { const c = cats.find(x => x.id === catOpen.id); c.icon = b.dataset.pi; c.emoji = ''; catOpen = null; save(); renderCatList(); renderAll(); });
  $('c-body').querySelectorAll('[data-pc]').forEach(b => b.onclick = () => { const c = cats.find(x => x.id === catOpen.id); c.color = b.dataset.pc; catOpen = null; save(); renderCatList(); renderAll(); });
  $('c-body').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const c = cats.find(x => x.id === b.dataset.rm); snap();
    cats = cats.filter(x => x !== c); save(); renderCatList(); renderAll(); toast('Obrisano · ' + (c.name || ''), true);
  });
  $('cl-new').onclick = () => { closeSheet('sh-cats'); setTimeout(openNewCat, 260); };
}

/* ============================================================
   POSTAVKE, IZVOZ, UVOZ
   ============================================================ */
function openSettings() {
  const mode = Store.mode === 'sqlite' ? 'SQLite' : Store.mode === 'idb' ? 'IndexedDB' : '—';
  $('s-body').innerHTML =
    '<button class="tile" id="s-cats" style="height:50px"><span class="n">Kategorije</span></button>' +
    '<button class="tile" id="s-an" style="height:50px"><span class="n">Analiza</span></button>' +
    '<div class="lbl-row">Podaci · ' + mode + '</div>' +
    '<div class="data-row"><button class="btn-quiet" id="s-exp">Izvoz</button><button class="btn-quiet" id="s-imp">Uvoz</button></div>' +
    '<div class="num" style="font-size:12px;color:var(--text-2)">' + logs.length + ' unosa · ' + liveCats().length + ' kategorija</div>';
  $('s-cats').onclick = () => { closeSheet('sh-set'); setTimeout(() => openCats(null), 260); };
  $('s-an').onclick = () => { closeSheet('sh-set'); setTimeout(() => openAnalysis('day'), 260); };
  $('s-exp').onclick = exportData;
  $('s-imp').onclick = pickImport;
  openSheet('sh-set');
}
$('btn-set').onclick = openSettings;

async function exportData() {
  const name = 'my24-' + ymd(new Date()) + '.json';
  const json = JSON.stringify({ app: 'my24', version: 2, exported: new Date().toISOString(),
    categories: cats.filter(c => c.name.trim()),
    logs: logs.map(l => ({ id: l.id, title: l.title, catId: l.catId, startTime: new Date(l.s).toISOString(), endTime: l.e === null ? '' : new Date(l.e).toISOString(), note: l.note })),
    quicks: JSON.parse(quicksRaw || '[]') }, null, 2);
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins.Filesystem) {
    try {
      await cap.Plugins.Filesystem.writeFile({ path: name, data: json, directory: 'CACHE', encoding: 'utf8' });
      const uri = await cap.Plugins.Filesystem.getUri({ path: name, directory: 'CACHE' });
      if (cap.Plugins.Share) await cap.Plugins.Share.share({ title: name, url: uri.uri });
      return;
    } catch (e) {}
  }
  const a = document.createElement('a');
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Izvezeno · ' + name);
}
function pickImport() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importJson(String(r.result)); r.readAsText(f); };
  inp.click();
}
function importJson(text) {
  let d; try { d = JSON.parse(text); } catch (e) { toast('Neispravna datoteka'); return; }
  if (!d || (!Array.isArray(d.logs) && !Array.isArray(d.categories))) { toast('Neispravna datoteka'); return; }
  snap();
  let nl = 0, nc = 0;
  (d.categories || []).forEach(c => { if (c && c.id && !cats.some(x => x.id === c.id)) { cats.push({ id: c.id, name: c.name || '', icon: c.icon || '', emoji: c.emoji || '', color: c.color || nextColor() }); nc++; } });
  (d.logs || []).forEach(l => { if (l && l.id && l.startTime && !logs.some(x => x.id === l.id)) { logs.push({ id: l.id, title: l.title || '', catId: l.catId || '', note: l.note || '', s: floorMin(+new Date(l.startTime)), e: l.endTime ? floorMin(+new Date(l.endTime)) : null }); nl++; } });
  normalize(); save(); renderAll(); toast('Uvezeno · ' + nl + ' unosa · ' + nc + ' kategorija', true);
}

/* ============================================================
   ANALIZA (skrivena: Kalendar → Analiza, ili ⋯)
   ============================================================ */
function openAnalysis(range) {
  const n = nowMs(), d0 = +parseYmd(ui.kalDay);
  const a = range === 'week' ? d0 - 6 * DAY : d0, b = Math.min(d0 + DAY, n);
  const tot = {};
  let all = 0;
  logs.forEach(l => { const ov = Math.min(endOf(l), b) - Math.max(l.s, a); if (ov > 0) { tot[l.catId] = (tot[l.catId] || 0) + ov; all += ov; } });
  const ids = Object.keys(tot).sort((x, y) => tot[y] - tot[x]);
  $('a-body').innerHTML =
    '<div class="seg"><button data-r="day" class="' + (range === 'day' ? 'on' : '') + '">Dan</button><button data-r="week" class="' + (range === 'week' ? 'on' : '') + '">7 dana</button></div>' +
    '<div class="num" style="font-size:13px;color:var(--text-2)">' + durLong(all) + ' upisano</div>' +
    (ids.length ? ids.map(id => { const c = catOf(id), p = all ? tot[id] / all : 0; return '<div class="an-row"><i class="bar" style="background:' + c.color + '"></i>' + catMark(c, 17) + '<span class="nm">' + esc(c.name) + '</span><span class="v">' + dur(tot[id]) + ' · ' + Math.round(p * 100) + '%</span></div><div class="an-bar"><i style="width:' + (p * 100).toFixed(1) + '%"></i></div>'; }).join('') : '<div class="kal-empty">Nema podataka.</div>');
  $('a-body').querySelectorAll('[data-r]').forEach(b => b.onclick = () => openAnalysis(b.dataset.r));
  if (!$('sh-an').classList.contains('on')) openSheet('sh-an');
}

/* ============================================================
   LISTOVI, TOAST, TABOVI
   ============================================================ */
let openSheets = [];
function openSheet(id) {
  openSheets = openSheets.filter(x => x !== id).concat([id]);
  $(id).classList.add('on'); $('scrim').classList.add('on');
}
function closeSheet(id) {
  $(id).classList.remove('on');
  openSheets = openSheets.filter(x => x !== id);
  if (!openSheets.length) $('scrim').classList.remove('on');
  if (id === 'sh-wheel') W = null;
  if (id === 'sh-cats') { cats = cats.filter(c => c.name.trim()); save(); renderAll(); }
}
$('scrim').onclick = () => { const top = openSheets[openSheets.length - 1]; if (top) closeSheet(top); };
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeSheet(b.closest('.sheet').id));

let toastTm = null;
function toast(msg, withUndo) {
  clearTimeout(toastTm);
  $('toast-msg').textContent = msg;
  $('toast-act').classList.toggle('hide', !withUndo);
  $('toast').classList.add('on');
  toastTm = setTimeout(() => $('toast').classList.remove('on'), withUndo ? 4500 : 2200);
}
$('toast-act').onclick = () => { undo(); $('toast').classList.remove('on'); };

$('tabs').querySelectorAll('button').forEach(b => b.onclick = () => {
  ui.tab = b.dataset.t;
  $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  $('v-today').classList.toggle('hide', ui.tab !== 'today');
  $('v-kal').classList.toggle('hide', ui.tab !== 'kal');
  if (ui.tab === 'kal') { ui.kalDay = ui.kalDay || ymd(new Date()); renderKal(); } else renderToday();
});

function renderAll() { renderToday(); if (ui.tab === 'kal') renderKal(); }

/* ---------- sat koji teče ---------- */
let lastMinute = nowMs();
setInterval(() => {
  const r = running(), el = $('run-time');
  if (r && el) el.textContent = hm(r.s) + ' · ' + clock(Date.now() - r.s);
  const m = nowMs();
  if (m !== lastMinute) {
    lastMinute = m;
    const busy = openSheets.length || ui.nameEdit || ui.descEdit || document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (!busy && !document.hidden) renderAll();
  }
}, 1000);
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (Date.now() - hiddenAt > 5 * MIN) { ui.fresh = null; ui.nameEdit = false; ui.descEdit = false; }
  if (!openSheets.length) renderAll();
});

/* ============================================================
   START
   ============================================================ */
(async function init() {
  buildWheel();
  await Store.open();
  await migrateStore();
  await loadData();
  renderAll();
})();
</script>
</body>
</html>
